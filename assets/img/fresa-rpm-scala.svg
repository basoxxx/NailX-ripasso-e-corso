le" font-weight="800" fill="#c0392b">il servizio</text><rect x="87.7" y="74" width="150.9" height="12" rx="6" fill="#3d9a5c"/><text x="87.7" y="69.0" font-size="13" text-anchor="start" font-weight="700" fill="#3b2a30">Zona cuticolare 2.000–10.000</text><rect x="200.9" y="108" width="132.0" height="12" rx="6" fill="#7fae4a"/><text x="200.9" y="103.0" font-size="13" text-anchor="start" font-weight="700" fill="#3b2a30">Levigare 8.000–15.000</text><rect x="238.6" y="142" width="188.6" height="12" rx="6" fill="#d9a12a"/><text x="238.6" y="137.0" font-size="13" text-anchor="start" font-weight="700" fill="#3b2a30">Forma e refill 10.000–20.000</text><rect x="332.9" y="176" width="188.6" height="12" rx="6" fill="#d9792a"/><text x="521.4" y="171.0" font-size="13" text-anchor="end" font-weight="700" fill="#3b2a30">Rimozione (esperte) 15.000–25.000</text><rect x="50" y="208" width="660" height="22" rx="11" fill="url(#rpmg)"/><line x1="50.0" y1="230" x2="50.0" y2="236" stroke="#3b2a30"/><text x="50.0" y="250.0" font-size="12" text-anchor="start" font-weight="600" fill="#7a6369">0</text><line x1="144.3" y1="230" x2="144.3" y2="236" stroke="#3b2a30"/><text x="144.3" y="250.0" font-size="12" text-anchor="middle" font-weight="600" fill="#7a6369">5.000</text><line x1="238.6" y1="230" x2="238.6" y2="236" stroke="#3b2a30"/><text x="238.6" y="250.0" font-size="12" text-anchor="middle" font-weight="600" fill="#7a6369">10.000</text><line x1="332.9" y1="230" x2="332.9" y2="236" stroke="#3b2a30"/><text x="332.9" y="250.0" font-size="12" text-anchor="middle" font-weight="600" fill="#7a6369">15.000</text><line x1="427.1" y1="230" x2="427.1" y2="236" stroke="#3b2a30"/><text x="427.1" y="250.0" font-size="12" text-anchor="middle" font-weight="600" fill="#7a6369">20.000</text><line x1="521.4" y1="230" x2="521.4" y2="236" stroke="#3b2a30"/><text x="521.4" y="250.0" font-size="12" text-anchor="middle" font-weight="600" fill="#7a6369">25.000</text><line x1="615.7" y1="230" x2="615.7" y2="236" strok