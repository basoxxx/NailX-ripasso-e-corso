<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Gli strati della lamina ungueale e la matrice che li produce</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxSkin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2b29b"/><stop offset=".22" stop-color="#f3cdb6"/><stop offset=".55" stop-color="#f8dccb"/><stop offset=".82" stop-color="#f1c7af"/><stop offset="1" stop-color="#dfac94"/></linearGradient><linearGradient id="nxPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6f3"/><stop offset="1" stop-color="#f8ece8"/></linearGradient><filter id="nxSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#5a2a3a" flood-opacity=".13"/></filter><filter id="nxShS" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#3b2a30" flood-opacity=".25"/></filter></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">La lamina è fatta a strati</text><rect x="20.0" y="56.0" width="440.0" height="344.0" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="240.0" y="84.0" font-size="15" text-anchor="middle" font-weight="700" fill="#3b2a30">Sezione del dito (ingrandita)</text><rect x="34" y="168" width="412" height="166" fill="url(#nxSkin)"/><rect x="186" y="206" width="260" height="12" fill="#ee8ea7"/><path d="M70,212 Q90,224 110,212 L110,232 Q90,244 70,232 Z" fill="#b39ddb" stroke="#8d6fb8" stroke-width="1.2"/><path d="M110,212 Q130,224 150,212 L150,232 Q130,244 110,232 Z" fill="#d1c4e9" stroke="#8d6fb8" stroke-width="1.2"/><path d="M150,212 Q170,224 190,212 L190,232 Q170,244 150,232 Z" fill="#f8bbd0" stroke="#8d6fb8" stroke-width="1.2"/><path d="M66,170 Q80,166 96,166 L446,166 L446,176 L70,176 Z" fill="#b39ddb"/><path d="M70,176 L446,176 L446,198 L70,198 Z" fill="#d1c4e9"/><path d="M70,198 L446,198 L446,206 L70,206 Z" fill="#f8bbd0"/><path d="M96,166 L446,166 M70,206 L446,206" stroke="#b9496f" stroke-width="1.6"/><path d="M34,120 L150,120 Q188,122 194,160 L190,166 Q150,160 96,164 L34,164 Z" fill="url(#nxSkin)" stroke="#d39c80" stroke-width="1.5"/><rect x="34" y="150" width="36" height="24" fill="url(#nxSkin)"/><defs><marker id="mk1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f53a6"/></marker></defs><path d="M90,214 Q120,180 214,171" fill="none" stroke="#6f53a6" stroke-width="2" marker-end="url(#mk1)"/><defs><marker id="mk2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a74c0"/></marker></defs><path d="M130,214 Q160,192 226,187" fill="none" stroke="#8a74c0" stroke-width="2" marker-end="url(#mk2)"/><defs><marker id="mk3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2577a"/></marker></defs><path d="M170,214 Q190,206 238,202" fill="none" stroke="#c2577a" stroke-width="2" marker-end="url(#mk3)"/><line x1="120.0" y1="140.0" x2="70.0" y2="104.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="120.0" cy="140.0" r="3.5" fill="#8e3b5a"/><text x="76.0" y="109.0" font-size="13.5" text-anchor="start" font-weight="600" fill="#3b2a30">Piega prossimale</text><line x1="110.0" y1="238.0" x2="92.0" y2="362.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="110.0" cy="238.0" r="3.5" fill="#8e3b5a"/><text x="92.0" y="367.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#3b2a30">Matrice</text><line x1="176.0" y1="236.0" x2="200.0" y2="304.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="176.0" cy="236.0" r="3.5" fill="#8e3b5a"/><text x="200.0" y="309.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#3b2a30">Lunula</text><line x1="330.0" y1="212.0" x2="340.0" y2="290.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="330.0" cy="212.0" r="3.5" fill="#8e3b5a"/><text x="340.0" y="295.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#3b2a30">Letto ungueale</text><text x="240.0" y="386.0" font-size="13" text-anchor="middle" font-weight="400" fill="#7a6369" font-style="italic">Ogni parte della matrice produce uno strato</text><rect x="512" y="108" width="170" height="14" fill="#b39ddb" stroke="#8d6fb8" stroke-width="1.2"/><path d="M682,108 L718,82 L718,96 L682,122 Z" fill="#b39ddb" stroke="#8d6fb8" stroke-width="1.2" opacity=".9"/><rect x="512" y="122" width="170" height="44" fill="#d1c4e9" stroke="#8d6fb8" stroke-width="1.2"/><path d="M682,122 L718,96 L718,140 L682,166 Z" fill="#d1c4e9" stroke="#8d6fb8" stroke-width="1.2" opacity=".9"/><rect x="512" y="166" width="170" height="14" fill="#f8bbd0" stroke="#8d6fb8" stroke-width="1.2"/><path d="M682,166 L718,140 L718,154 L682,180 Z" fill="#f8bbd0" stroke="#8d6fb8" stroke-width="1.2" opacity=".9"/><path d="M512,108 L548,82 L718,82 L682,108 Z" fill="#c9b6e6" stroke="#8d6fb8" stroke-width="1.2"/><line x1="518" y1="129.3" x2="676" y2="129.3" stroke="#9c86c9" stroke-width="1.4" stroke-dasharray="10 5"/><line x1="518" y1="136.6" x2="676" y2="136.6" stroke="#9c86c9" stroke-width="1.4" stroke-dasharray="10 5"/><line x1="518" y1="143.9" x2="676" y2="143.9" stroke="#9c86c9" stroke-width="1.4" stroke-dasharray="10 5"/><line x1="518" y1="151.2" x2="676" y2="151.2" stroke="#9c86c9" stroke-width="1.4" stroke-dasharray="10 5"/><line x1="518" y1="158.5" x2="676" y2="158.5" stroke="#9c86c9" stroke-width="1.4" stroke-dasharray="10 5"/><line x1="572.0" y1="144.0" x2="560.0" y2="66.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="572.0" cy="144.0" r="3.5" fill="#8e3b5a"/><text x="566.0" y="71.0" font-size="13.5" text-anchor="start" font-weight="600" fill="#3b2a30">Fibre da lato a lato</text><rect x="486" y="200" width="22" height="22" rx="4" fill="#b39ddb" stroke="#8d6fb8"/><text x="518.0" y="210.0" font-size="14" text-anchor="start" font-weight="700" fill="#3b2a30">Strato superiore</text><text x="518.0" y="227.0" font-size="13" text-anchor="start" font-weight="400" fill="#7a6369">duro, resiste all'acqua</text><rect x="486" y="242" width="22" height="22" rx="4" fill="#d1c4e9" stroke="#8d6fb8"/><text x="518.0" y="252.0" font-size="14" text-anchor="start" font-weight="700" fill="#3b2a30">Strato centrale</text><text x="518.0" y="269.0" font-size="13" text-anchor="start" font-weight="400" fill="#7a6369">il più spesso, flessibile</text><rect x="486" y="284" width="22" height="22" rx="4" fill="#f8bbd0" stroke="#8d6fb8"/><text x="518.0" y="294.0" font-size="14" text-anchor="start" font-weight="700" fill="#3b2a30">Strato inferiore</text><text x="518.0" y="311.0" font-size="13" text-anchor="start" font-weight="400" fill="#7a6369">aderisce al letto</text><rect x="474" y="332" width="272" height="70" rx="12" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><g transform="translate(504.0,350.0) rotate(0.0)"><rect x="-20.0" y="-6.0" width="40" height="6" rx="6" fill="#cfc3b8"/><rect x="-20.0" y="0.0" width="40" height="6" rx="3" fill="#efe8e1"/></g><circle cx="538.0" cy="350.0" r="10" fill="#2f8a5b" stroke="#fff" stroke-width="2" filter="url(#nxShS)"/><path d="M531.0,350.0 l5,5 l9,-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="552.0" y="355.0" font-size="13" text-anchor="start" font-weight="600" fill="#3b2a30">Opacizza solo la superficie</text><g transform="translate(504.0,384.0) rotate(0.0)"><rect x="-20.0" y="-8.0" width="40" height="8" rx="8" fill="#6f6259"/><rect x="-20.0" y="0.0" width="40" height="8" rx="4" fill="#9a8b80"/></g><circle cx="538.0" cy="384.0" r="10" fill="#c0392b" stroke="#fff" stroke-width="2" filter="url(#nxShS)"/><path d="M533.0,379.0 l10,10 M543.0,379.0 l-10,10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="552.0" y="389.0" font-size="13" text-anchor="start" font-weight="600" fill="#3b2a30">Non assottigliare la lamina</text></svg>
