<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Curva a C bassa, media e alta</title><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="40.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Curva a C – vista frontale dal bordo libero</text><circle cx="150" cy="208" r="62" fill="none" stroke="#e5d6d2" stroke-dasharray="4 5"/><path d="M75,170 Q150,142 225,170" fill="none" stroke="#c2577a" stroke-width="12" stroke-linecap="round"/><path d="M80,170 Q150,145 220,170" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/><text x="150.0" y="220.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Bassa (piatta)</text><text x="150.0" y="242.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#7a6369">unghie piatte, corte</text><circle cx="410" cy="190" r="62" fill="none" stroke="#e5d6d2" stroke-dasharray="4 5"/><path d="M335,170 Q410,106 485,170" fill="none" stroke="#c2577a" stroke-width="12" stroke-linecap="round"/><path d="M340,170 Q410,109 480,170" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/><text x="410.0" y="220.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Media</text><text x="410.0" y="242.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#7a6369">uso quotidiano</text><circle cx="670" cy="170" r="62" fill="none" stroke="#e5d6d2" stroke-dasharray="4 5"/><path d="M595,170 Q670,66 745,170" fill="none" stroke="#c2577a" stroke-width="12" stroke-linecap="round"/><path d="M600,170 Q670,69 740,170" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/><text x="670.0" y="220.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Alta (pinching)</text><text x="670.0" y="242.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#7a6369">gara / unghie lunghe</text><text x="410.0" y="285.0" font-size="14" text-anchor="middle" font-weight="400" fill="#7a6369">La curva segue quella naturale della cliente: non esiste un valore unico per tutti.</text></svg>
