<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>I punti della scheda French Twist 3-Shape Challenge 2026, giudice per giudice</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6f3"/><stop offset="1" stop-color="#f8ece8"/></linearGradient><filter id="nxSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#5a2a3a" flood-opacity=".13"/></filter></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Dove sono i punti (French Twist 3 forme, 240 pt)</text><text x="278.0" y="82.0" font-size="13.5" text-anchor="end" font-weight="600" fill="#3b2a30">G1 Smile line</text><rect x="290.0" y="69.0" width="126.0" height="20.0" rx="4" fill="#d9c3cb" stroke="none" stroke-width="0"/><text x="424.0" y="84.0" font-size="14" text-anchor="start" font-weight="800" fill="#7a6369">15</text><text x="278.0" y="112.0" font-size="13.5" text-anchor="end" font-weight="600" fill="#3b2a30">G2 Lunghezza</text><rect x="290.0" y="99.0" width="126.0" height="20.0" rx="4" fill="#d9c3cb" stroke="none" stroke-width="0"/><text x="424.0" y="114.0" font-size="14" text-anchor="start" font-weight="800" fill="#7a6369">15</text><text x="278.0" y="142.0" font-size="13.5" text-anchor="end" font-weight="700" fill="#3b2a30">G3 Curva C + apex</text><rect x="290.0" y="129.0" width="252.0" height="20.0" rx="4" fill="#8e3b5a" stroke="none" stroke-width="0"/><text x="550.0" y="144.0" font-size="14" text-anchor="start" font-weight="800" fill="#8e3b5a">30</text><text x="278.0" y="172.0" font-size="13.5" text-anchor="end" font-weight="700" fill="#3b2a30">G4 Spessore + convesso/concavo</text><rect x="290.0" y="159.0" width="252.0" height="20.0" rx="4" fill="#8e3b5a" stroke="none" stroke-width="