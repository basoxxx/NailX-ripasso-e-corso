idth="0"/><text x="499.6" y="354.0" font-size="14" text-anchor="start" font-weight="800" fill="#7a6369">24</text><line x1="290.0" y1="62.0" x2="290.0" y2="366.0" stroke="#ead9d5" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="416.0" y1="62.0" x2="416.0" y2="366.0" stroke="#ead9d5" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="542.0" y1="62.0" x2="542.0" y2="366.0" stroke="#ead9d5" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="668.0" y1="62.0" x2="668.0" y2="366.0" stroke="#ead9d5" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="700.0" y="70.0" width="180.0" height="112.0" rx="12" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)" stroke="none" stroke-width="2"/><rect x="714.0" y="86.0" width="16.0" height="16.0" rx="3" fill="#8e3b5a" stroke="none" stroke-width="2"/><text x="738.0" y="99.0" font-size="13" text-anchor="start" font-weight="800" fill="#8e3b5a">struttura = 90 pt</text><rect x="714.0" y="116.0" width="16.0" height="16.0" rx="3" fill="#2f8a5b" stroke="none" stroke-width="2"/><text x="738.0" y="129.0" font-size="13" text-anchor="start" font-weight="800" fill="#2f8a5b">punti "facili"</text><rect x="714.0" y="146.0" width="16.0" height="16.0" rx="3" fill="#d9c3cb" stroke="none" stroke-width="2"/><text x="738.0" y="159.0" font-size="13" text-anchor="start" font-weight="600" fill="#7a6369">altri criteri</text><text x="880.0" y="420.0" font-size="12" text-anchor="end" font-weight="600" fill="#7a6369">Fonte: scheda Nailympia 2026</text><text x="20.0" y="400.0" font-size="13" text-anchor="start" font-weight="600" fill="#3b2a30">Ogni barra = punti assegnati da un giudice (10 giudici). Leggi sempre la scheda della tua categoria.</text></svg>
