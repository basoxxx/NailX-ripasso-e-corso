<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Etichetta di un gel: avvertenze HEMA, assenza di TPO e DMTA, lotto e PAO</title><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Cosa cercare in etichetta</text><rect x="58" y="150" width="110" height="200" rx="18" fill="#f6d6df" stroke="#b9496f" stroke-width="2"/><rect x="80" y="86" width="66" height="70" rx="8" fill="#3b2a30"/><rect x="72" y="200" width="82" height="96" rx="6" fill="#fff"/><text x="113.0" y="228.0" font-size="13" text-anchor="middle" font-weight="900" fill="#8e3b5a">BUILDER</text><text x="113.0" y="248.0" font-size="13" text-anchor="middle" font-weight="900" fill="#8e3b5a">GEL</text><text x="113.0" y="276.0" font-size="12" text-anchor="middle" font-weight="600" fill="#7a6369">15 ml</text><path d="M176,240 L214,200 M176,240 L214,330" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="220" y="60" width="520" height="346" rx="10" fill="#fffdf8" stroke="#6f7983" stroke-width="1.8"/><rect x="234" y="74" width="492" height="26" rx="5" fill="#d9f0e2"/><circle cx="250.0" cy="87.0" r="9" fill="#2f8a5b"/><path d="M243.0,87.0 l5,5 l9,-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="266.0" y="92.0" font-size="14.5" text-anchor="start" font-weight="700" fill="#3b2a30">Solo per uso professionale</text><rect x="234" y="108" width="492" height="26" rx="5" fill="#d9f0e2"/><circle cx="250.0" cy="121.0" r="9" fill="#2f8a5b"/><path d="M243.0,121.0 l5,5 l9,-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="266.0" y="126.0" font-size="14.5" text-anchor="start" font-weight="700" fill="#3b2a30">Può provocare una reazione allergica</text><text x="234.0" y="164.0" font-size="13.5" text-anchor="start" font-weight="600" fill="#3b2a30">INGREDIENTS: Urethane Dimethacrylate,</text><text x="234.0" y="184.0" font-size="13.5" text-anchor="start" font-weight="600" fill="#3b2a30">HEMA, Silica, Hydroxycyclohexyl Phenyl Ketone...</text><line x1="234" y1="189" x2="276" y2="189" stroke="#8e3b5a" stroke-width="2.5"/><circle cx="676.0" cy="162.0" r="20.0" fill="#ffffff" fill-opacity=".35" stroke="#8e3b5a" stroke-width="3.5"/><line x1="690.4" y1="176.4" x2="708.0" y2="194.0" stroke="#8e3b5a" stroke-width="6" stroke-linecap="round"/><text x="234.0" y="212.0" font-size="13.5" text-anchor="start" font-weight="800" fill="#c0392b">Se nell'INCI trovi questi nomi: non usare</text><rect x="234" y="224" width="492" height="26" rx="5" fill="#fbe1de"/><text text-decoration="line-through" x="242.0" y="242.0" font-size="13" text-anchor="start" font-weight="600" fill="#3b2a30">Trimethylbenzoyl Diphenylphosphine Oxide (TPO)</text><rect x="568.4" y="225.6" width="152.4" height="21.0" rx="10.4" fill="#c0392b"/><text x="644.6" y="241.6" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">VIETATO dal 1/9/2025</text><rect x="234" y="254" width="492" height="26" rx="5" fill="#fbe1de"/><text text-decoration="line-through" x="242.0" y="272.0" font-size="13" text-anchor="start" font-weight="600" fill="#3b2a30">Dimethyltolylamine (DMTA)</text><rect x="653.9" y="255.6" width="65.0" height="21.0" rx="10.4" fill="#c0392b"/><text x="686.5" y="271.6" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">VIETATO</text><text x="234.0" y="316.0" font-size="14" text-anchor="start" font-weight="700" fill="#3b2a30">Lotto: 2409A</text><g transform="translate(410.0,308.0) scale(1.15)"><path d="M-14,-6 L14,-6 L12,16 L-12,16 Z" fill="#fff" stroke="#3b2a30" stroke-width="2"/><path d="M-15,-8 L13,-18 L15,-13 L-13,-3 Z" fill="#fff" stroke="#3b2a30" stroke-width="2"/></g><text x="410.0" y="318.4" font-size="13.575" text-anchor="middle" font-weight="800" fill="#3b2a30">12M</text><text x="434.0" y="316.0" font-size="13" text-anchor="start" font-weight="600" fill="#7a6369">dopo l'apertura</text><text x="234.0" y="346.0" font-size="14" text-anchor="start" font-weight="700" fill="#3b2a30">Responsabile: nome e indirizzo UE</text><text x="234.0" y="370.0" font-size="13" text-anchor="start" font-weight="600" fill="#7a6369">Etichetta e avvertenze in italiano</text></svg>
