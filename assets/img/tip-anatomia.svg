<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Le parti del tip: incavo, punto d'arresto, zona di contatto, corpo e curva a C</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker></defs><defs><pattern id="hatchB" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#c2577a" stroke-width="2.2" opacity="0.55"/></pattern></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Com'è fatto un tip</text><path d="M70.0,300.0 L70.0,95.0 Q70.0,70.0 120.0,70.0 Q170.0,70.0 170.0,95.0 L170.0,300.0 Q120.0,326.0 70.0,300.0 Z" fill="#f3eee6" fill-opacity="1.00" stroke="#b9ab98" stroke-width="1.6"/><defs><clipPath id="t6"><path d="M70.0,300.0 L70.0,95.0 Q70.0,70.0 120.0,70.0 Q170.0,70.0 170.0,95.0 L170.0,300.0 Q120.0,326.0 70.0,300.0 Z"/></clipPath></defs><rect x="68.0" y="230.0" width="104.0" height="100.0" fill="url(#hatchB)" clip-path="url(#t6)"/><line x1="70.0" y1="230.0" x2="170.0" y2="230.0" stroke="#b9ab98" stroke-width="2.2"/><line x1="108.0" y1="270.0" x2="230.0" y2="262.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="108.0" cy="270.0" r="3.5" fill="#8e3b5a"/><text x="236.0" y="267.0" font-size="14" text-anchor="start" font-weight="600" fill="#3b2a30">Incavo (well)</text><line x1="150.0" y1="230.0" x2="230.0" y2="222.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="150.0" cy="230.0" r="3.5" fill="#8e3b5a"/><text x="236.0" y="227.0" font-size="14" text-anchor="start" font-weight="600" fill="#3b2a30">Punto d'arresto</text><line x1="142.0" y1="290.0" x2="230.0" y2="300.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="142.0" cy="290.0" r="3.5" fill="#8e3b5a"/><text x="236.0" y="305.0" font-size="14" text-anchor="start" font-weight="600" fill="#3b2a30">Zona di contatto</text><text x="236.0" y="318.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#7a6369">(sotto l'incavo)</text><line x1="130.0" y1="140.0" x2="230.0" y2="130.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="130.0" cy="140.0" r="3.5" fill="#8e3b5a"/><text x="236.0" y="135.0" font-size="14" text-anchor="start" font-weight="600" fill="#3b2a30">Corpo del tip</text><text x="120.0" y="60.0" font-size="13" text-anchor="middle" font-weight="700" fill="#7a6369">dall'alto</text><rect x="400" y="64" width="340" height="250" rx="16" fill="#fbf1ee"/><text x="570.0" y="92.0" font-size="13" text-anchor="middle" font-weight="700" fill="#7a6369">di profilo</text><path d="M430,176 L430,172 L540,168 L540,160 Q640,158 720,172 L720,180 Q640,170 548,176 L540,184 L540,178 Z" fill="#f3eee6" stroke="#b9ab98" stroke-width="1.8"/><rect x="430" y="178" width="110" height="9" fill="url(#hatchB)"/><rect x="430" y="178" width="110" height="9" fill="none" stroke="#7a6369" stroke-dasharray="3 3"/><line x1="600.0" y1="222.0" x2="545.0" y2="186.0" stroke="#8e3b5a" stroke-width="2.2" marker-end="url(#ar)"/><text x="604.0" y="236.0" font-size="12.5" text-anchor="start" font-weight="600" fill="#3b2a30">gradino: si appoggia</text><text x="604.0" y="251.6" font-size="12.5" text-anchor="start" font-weight="600" fill="#3b2a30">al bordo libero</text><line x1="480.0" y1="172.0" x2="470.0" y2="130.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="480.0" cy="172.0" r="3.5" fill="#8e3b5a"/><text x="470.0" y="135.0" font-size="13" text-anchor="middle" font-weight="600" fill="#3b2a30">incavo sottile</text><line x1="484.0" y1="186.0" x2="470.0" y2="222.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="484.0" cy="186.0" r="3.5" fill="#8e3b5a"/><text x="470.0" y="227.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#3b2a30">zona di contatto</text><path d="M424,294 Q464,262 504,294" fill="none" stroke="#b9ab98" stroke-width="7" stroke-linecap="round"/><text x="516.0" y="284.0" font-size="13" text-anchor="start" font-weight="700" fill="#3b2a30">Curva a C</text><text x="516.0" y="300.0" font-size="12" text-anchor="start" font-weight="400" fill="#7a6369">(vista dalla punta)</text><text x="380.0" y="352.0" font-size="15" text-anchor="middle" font-weight="800" fill="#8e3b5a">L'incavo copre al massimo metà unghia.</text></svg>
