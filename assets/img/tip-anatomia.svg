<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Le parti del tip: corpo, punto d'arresto, incavo e zona di contatto; profilo ingrandito e curva a C</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6f3"/><stop offset="1" stop-color="#f8ece8"/></linearGradient><filter id="nxSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#5a2a3a" flood-opacity=".13"/></filter></defs><defs><linearGradient id="bTipG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ddd3c4"/><stop offset=".3" stop-color="#fbf8f3"/><stop offset=".7" stop-color="#f3eee6"/><stop offset="1" stop-color="#d6cbbb"/></linearGradient><linearGradient id="bTipV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e2d8c9"/></linearGradient></defs><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker></defs><defs><pattern id="hatchB" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#c2577a" stroke-width="2.2" opacity="0.55"/></pattern></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Com'è fatto un tip</text><text x="112.0" y="64.0" font-size="15" text-anchor="middle" font-weight="700" fill="#7a6369">dall'alto</text><path d="M64.0,306.0 L64.0,104.0 Q64.0,80.0 112.0,80.0 Q160.0,80.0 160.0,104.0 L160.0,306.0 Q112.0,332.0 64.0,306.0 Z" fill="url(#bTipG)" fill-opacity=