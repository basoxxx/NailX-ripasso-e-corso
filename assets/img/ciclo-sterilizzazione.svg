<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 305" width="940" height="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Ciclo di ricondizionamento degli strumenti</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Il ciclo degli strumenti dopo ogni cliente</text><circle cx="90" cy="140" r="50" fill="#f8dfe7"/><text x="90.0" y="136.0" font-size="22" text-anchor="middle" font-weight="800" fill="#8e3b5a">1</text><text x="90.0" y="158.0" font-size="14" text-anchor="middle" font-weight="800" fill="#3b2a30">Detergi</text><text x="90.0" y="215.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">acqua e detergente</text><line x1="144.0" y1="140.0" x2="184.0" y2="140.0" stroke="#8e3b5a" stroke-width="2.2" marker-end="url(#ar)"/><circle cx="240" cy="140" r="50" fill="#f3c4d3"/><text x="240.0" y="136.0" font-size="22" text-anchor="middle" font-weight="800" fill="#8e3b5a">2</text><text x="240.0" y="158.0" font-size="14" text-anchor="middle" font-weight="800" fill="#3b2a30">Disinfetta</text><text x="240.0" y="215.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">per immersione</text><line x1="294.0" y1="140.0" x2="334.0" y2="140.0" stroke="#8e3b5a" stroke-width="2.2" marker-end="url(#ar)"/><circle cx="390" cy="140" r="50" fill="#eeaabf"/><text x="390.0" y="136.0" font-size="22" text-anchor="middle" font-weight="800" fill="#8e3b5a">3</text><text x="390.0" y="158.0" font-size="14" text-anchor="middle" font-weight="800" fill="#3b2a30">Risciacqua</text><text x="390.0" y="215.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">e asciuga bene</text><line x1="444.0" y1="140.0" x2="484.0" y2="140.0" stroke="#8e3b5a" stroke-width="2.2" marker-end="url(#ar)"/><circle cx="540" cy="140" r="50" fill="#e48fa9"/><text x="540.0" y="136.0" font-size="22" text-anchor="middle" font-weight="800" fill="#fff">4</text><text x="540.0" y="158.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">Imbusta</text><text x="540.0" y="215.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">buste sigillate</text><line x1="594.0" y1="140.0" x2="634.0" y2="140.0" stroke="#8e3b5a" stroke-width="2.2" marker-end="url(#ar)"/><circle cx="690" cy="140" r="50" fill="#c2577a"/><text x="690.0" y="136.0" font-size="22" text-anchor="middle" font-weight="800" fill="#fff">5</text><text x="690.0" y="158.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">Autoclave</text><text x="690.0" y="215.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">classe B (EN 13060)</text><line x1="744.0" y1="140.0" x2="784.0" y2="140.0" stroke="#8e3b5a" stroke-width="2.2" marker-end="url(#ar)"/><circle cx="840" cy="140" r="50" fill="#8e3b5a"/><text x="840.0" y="136.0" font-size="22" text-anchor="middle" font-weight="800" fill="#fff">6</text><text x="840.0" y="158.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">Registra</text><text x="840.0" y="215.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">conserva la stampa</text><rect x="40" y="245" width="860" height="44" rx="10" fill="#fbe7e4"/><text x="470.0" y="273.0" font-size="14" text-anchor="middle" font-weight="600" fill="#c0392b">Lime in carta e buffer non si sterilizzano: sono monouso o si regalano alla cliente.</text></svg>
