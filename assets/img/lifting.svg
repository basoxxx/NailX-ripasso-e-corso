<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Sollevamento della ricostruzione e sue cause</title><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="40.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Sollevamento (lifting): dove nasce e perché</text><path d="M114.7,440.0 L114.7,294.6 A65.3,65.3 0 0 1 245.3,294.6 L245.3,440.0 Z" fill="#f3cdb6" stroke="#d39c80" stroke-width="1.5"/><defs><clipPath id="c40"><path d="M134.0,406.0 L226.0,406.0 L226.0,250.0 L226.0,212.5 Q226.0,195.0 208.5,195.0 L151.5,195.0 Q134.0,195.0 134.0,212.5 L134.0,250.0 Z"/></clipPath></defs><path d="M134.0,406.0 L226.0,406.0 L226.0,250.0 L226.0,212.5 Q226.0,195.0 208.5,195.0 L151.5,195.0 Q134.0,195.0 134.0,212.5 L134.0,250.0 Z" fill="#e9a7bd"/><path d="M128.0,260.0 Q180.0,240.0 232.0,260.0 L232.0,135.0 L128.0,135.0 Z" fill="#e9a7bd" clip-path="url(#c40)"/><path d="M140,386 Q180,350 220,386 L220,366 Q180,330 140,366 Z" fill="#fff" opacity=".85" clip-path="url(#c40)"/><path d="M226,300 L210,330 L226,360 Z" fill="#fff" opacity=".85" clip-path="url(#c40)"/><path d="M134.0,406.0 L226.0,406.0 L226.0,250.0 L226.0,212.5 Q226.0,195.0 208.5,195.0 L151.5,195.0 Q134.0,195.0 134.0,212.5 L134.0,250.0 Z" fill="none" stroke="#b9496f" stroke-width="1.8"/><path d="M115.7,372.0 L130.0,372.0 Q180.0,422.0 230.0,372.0 L244.3,372.0 L244.3,430.0 L115.7,430.0 Z" fill="#f3cdb6"/><path d="M130.0,372.0 Q180.0,422.0 230.0,372.0" fill="none" stroke="#d39c80" stroke-width="1.8"/><path d="M130.0,372.0 L130.0,258.0" stroke="#d39c80" stroke-width="1.6"/><path d="M230.0,372.0 L230.0,258.0" stroke="#d39c80" stroke-width="1.6"/><line x1="180.0" y1="360.0" x2="330.0" y2="360.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="180.0" cy="360.0" r="3.5" fill="#8e3b5a"/><text x="336.0" y="365.0" font-size="14" text-anchor="start" font-weight="600" fill="#3b2a30">Sollevamento in zona cuticola</text><line x1="222.0" y1="330.0" x2="330.0" y2="300.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="222.0" cy="330.0" r="3.5" fill="#8e3b5a"/><text x="336.0" y="305.0" font-size="14" text-anchor="start" font-weight="600" fill="#3b2a30">Sollevamento laterale</text><text x="560.0" y="95.0" font-size="16" text-anchor="start" font-weight="800" fill="#3b2a30">Cause più frequenti</text><circle cx="572" cy="120" r="11" fill="#c2577a"/><text x="572.0" y="125.0" font-size="12" text-anchor="middle" font-weight="800" fill="#fff">1</text><text x="592.0" y="125.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Cuticola/pterigio non rimossi</text><circle cx="572" cy="153" r="11" fill="#c2577a"/><text x="572.0" y="158.0" font-size="12" text-anchor="middle" font-weight="800" fill="#fff">2</text><text x="592.0" y="158.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Olio o umidità sulla lamina</text><circle cx="572" cy="186" r="11" fill="#c2577a"/><text x="572.0" y="191.0" font-size="12" text-anchor="middle" font-weight="800" fill="#fff">3</text><text x="592.0" y="191.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Disidratante o primer saltati</text><circle cx="572" cy="219" r="11" fill="#c2577a"/><text x="572.0" y="224.0" font-size="12" text-anchor="middle" font-weight="800" fill="#fff">4</text><text x="592.0" y="224.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Prodotto a contatto con la pelle</text><circle cx="572" cy="252" r="11" fill="#c2577a"/><text x="572.0" y="257.0" font-size="12" text-anchor="middle" font-weight="800" fill="#fff">5</text><text x="592.0" y="257.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Bordo libero non sigillato</text><circle cx="572" cy="285" r="11" fill="#c2577a"/><text x="572.0" y="290.0" font-size="12" text-anchor="middle" font-weight="800" fill="#fff">6</text><text x="592.0" y="290.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Perla troppo bagnata o asciutta</text><circle cx="572" cy="318" r="11" fill="#c2577a"/><text x="572.0" y="323.0" font-size="12" text-anchor="middle" font-weight="800" fill="#fff">7</text><text x="592.0" y="323.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Refill fatto in ritardo</text><circle cx="572" cy="351" r="11" fill="#c2577a"/><text x="572.0" y="356.0" font-size="12" text-anchor="middle" font-weight="800" fill="#fff">8</text><text x="592.0" y="356.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Polimerizzazione incompleta</text><rect x="550" y="400" width="320" height="56" rx="10" fill="#fbe7e4"/><text x="565.0" y="423.0" font-size="13.5" text-anchor="start" font-weight="600" fill="#c0392b">Mai incollare sopra un sollevamento:</text><text x="565.0" y="439.9" font-size="13.5" text-anchor="start" font-weight="600" fill="#c0392b">umidità e batteri (Pseudomonas) si infiltrano.</text></svg>
