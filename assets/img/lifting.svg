<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Sollevamento della ricostruzione e sue cause</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxSkin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2b29b"/><stop offset=".22" stop-color="#f3cdb6"/><stop offset=".55" stop-color="#f8dccb"/><stop offset=".82" stop-color="#f1c7af"/><stop offset="1" stop-color="#dfac94"/></linearGradient><linearGradient id="nxPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6f3"/><stop offset="1" stop-color="#f8ece8"/></linearGradient><filter id="nxSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#5a2a3a" flood-opacity=".13"/></filter></defs><text x="40.0" y="40.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Sollevamento (lifting): dove nasce e perché</text><rect x="20" y="60" width="250" height="400" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="145.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Vista dall'alto</text><path d="M82.5,420.0 L82.5,272.7 A62.5,62.5 0 0 1 207.5,272.7 L207.5,420.0 Z" fill="url(#nxSkin)" stroke="#d39c80" stroke-width="1.5"/><defs><clipPath id="c72"><path d="M101.0,386.0 L189.0,386.0 L189.0,230.0 L189.0,196.7 Q189.0,180.0 172.3,180.0 L117.7,180.0 Q101.0,180.0 101.0,196.7 L101.0,230.0 Z"/></clipPath></defs><path d="M101.0,386.0 L189.0,386.0 L189.0,230.0 L189.0,196.7 Q189.0,180.0 172.3,180.0 L117.7,180.0 Q101.0,180.0 101.0,196.7 L101.0,230.0 Z" fill="#e9a7bd"/><path d="M95.0,240.0 Q145.0,220.0 195.0,240.0 L195.0,120.0 L95.0,120.0 Z" fill="#e9a7bd" clip-path="url(#c72)"/><path d="M105,366 Q145,330 185,366 L185,346 Q145,310 105,346 Z" fill="#fff" opacity=".85" clip-path="url(#c72)"/><path d="M189,280 L171,310 L189,340 Z" fill="#fff" opacity=".85" clip-path="url(#c72)"/><rect x="117.7" y="186.0" width="9.7" height="170.0" rx="4.8" fill="#fff" opacity=".32" clip-path="url(#c72)"/><path d="M101.0,386.0 L189.0,386.0 L189.0,230.0 L189.0,196.7 Q189.0,180.0 172.3,180.0 L117.7,180.0 Q101.0,180.0 101.0,196.7 L101.0,230.0 Z" fill="none" stroke="#b9496f" stroke-width="1.8"/><path d="M83.5,352.0 L97.0,352.0 Q145.0,402.0 193.0,352.0 L206.5,352.0 L206.5,410.0 L83.5,410.0 Z" fill="url(#nxSkin)"/><path d="M97.0,352.0 Q145.0,402.0 193.0,352.0" fill="none" stroke="#d39c80" stroke-width="1.8"/><path d="M97.0,352.0 L97.0,238.0" stroke="#d39c80" stroke-width="1.6"/><path d="M193.0,352.0 L193.0,238.0" stroke="#d39c80" stroke-width="1.6"/><circle cx="145.0" cy="336.0" r="13" fill="#8e3b5a" stroke="#fff" stroke-width="1.5"/><text x="145.0" y="341.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">A</text><circle cx="209.0" cy="310.0" r="13" fill="#8e3b5a" stroke="#fff" stroke-width="1.5"/><text x="209.0" y="315.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">B</text><text x="40.0" y="446.0" font-size="15" text-anchor="start" font-weight="700" fill="#3b2a30">A  cuticola</text><text x="152.0" y="446.0" font-size="15" text-anchor="start" font-weight="700" fill="#3b2a30">B  laterale</text><rect x="285" y="60" width="250" height="400" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="410.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Di profilo (ingrandito)</text><defs><clipPath id="pc73"><rect x="285" y="96" width="250" height="364" rx="16"/></clipPath></defs><defs><linearGradient id="sv74" gradientUnits="userSpaceOnUse" x1="0.0" y1="250.0" x2="0.0" y2="420.0"><stop offset="0" stop-color="#f8dccb"/><stop offset=".45" stop-color="#f3cdb6"/><stop offset="1" stop-color="#dba98f"/></linearGradient></defs><g clip-path="url(#pc73)"><rect x="280" y="300" width="260" height="130" fill="url(#sv74)"/><path d="M330,300 L540,300" stroke="#ee8ea7" stroke-width="8"/><path d="M280,288 L540,288 L540,302 L280,302 Z" fill="#f7d4dd" stroke="#b9496f" stroke-width="1.6"/><path d="M280,232 L322,232 C346,232 358,252 362,288 L280,302 Z" fill="url(#sv74)" stroke="#d39c80" stroke-width="1.6"/><path d="M374,274 Q380,254 420,250 L540,246 L540,288 L452,288 Q410,284 374,274 Z" fill="#e9a7bd" stroke="#b9496f" stroke-width="1.6"/><path d="M392,262 Q440,254 530,252" stroke="#fff" stroke-width="3" opacity=".6" fill="none" stroke-linecap="round"/><path d="M374,274 Q410,284 452,288 L374,288 Z" fill="#fff"/><circle cx="384" cy="282" r="3.2" fill="#7fb0cc"/><circle cx="400" cy="284" r="2.6" fill="#7fb0cc"/><circle cx="418" cy="285" r="2.2" fill="#7fb0cc"/><rect x="392" y="279" width="7" height="3" rx="1.5" fill="#2f8a5b"/><rect x="409" y="281" width="7" height="3" rx="1.5" fill="#2f8a5b"/></g><line x1="395.0" y1="283.0" x2="362.0" y2="196.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="395.0" cy="283.0" r="3.5" fill="#8e3b5a"/><text x="362.0" y="171.2" font-size="15" text-anchor="middle" font-weight="600" fill="#3b2a30">fessura: entrano</text><text x="362.0" y="190.0" font-size="15" text-anchor="middle" font-weight="600" fill="#3b2a30">umidità e batteri</text><line x1="480.0" y1="262.0" x2="470.0" y2="140.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="480.0" cy="262.0" r="3.5" fill="#8e3b5a"/><text x="470.0" y="145.0" font-size="15" text-anchor="middle" font-weight="600" fill="#3b2a30">prodotto</text><line x1="460.0" y1="296.0" x2="455.0" y2="350.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="460.0" cy="296.0" r="3.5" fill="#8e3b5a"/><text x="455.0" y="355.0" font-size="15" text-anchor="middle" font-weight="600" fill="#3b2a30">lamina naturale</text><text x="410.0" y="406.0" font-size="15" text-anchor="middle" font-weight="400" fill="#7a6369">più si aspetta,</text><text x="410.0" y="426.0" font-size="15" text-anchor="middle" font-weight="400" fill="#7a6369">più la fessura si allarga</text><text x="560.0" y="92.0" font-size="16" text-anchor="start" font-weight="800" fill="#3b2a30">Cause più frequenti</text><circle cx="572" cy="120" r="12" fill="#c2577a"/><text x="572.0" y="125.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">1</text><text x="592.0" y="125.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Cuticola non rimossa</text><circle cx="572" cy="153" r="12" fill="#c2577a"/><text x="572.0" y="158.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">2</text><text x="592.0" y="158.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Olio o umidità sulla lamina</text><circle cx="572" cy="186" r="12" fill="#c2577a"/><text x="572.0" y="191.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">3</text><text x="592.0" y="191.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Disidratante o primer saltati</text><circle cx="572" cy="219" r="12" fill="#c2577a"/><text x="572.0" y="224.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">4</text><text x="592.0" y="224.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Prodotto a contatto con la pelle</text><circle cx="572" cy="252" r="12" fill="#c2577a"/><text x="572.0" y="257.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">5</text><text x="592.0" y="257.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Bordo libero non sigillato</text><circle cx="572" cy="285" r="12" fill="#c2577a"/><text x="572.0" y="290.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">6</text><text x="592.0" y="290.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Perla troppo bagnata o asciutta</text><circle cx="572" cy="318" r="12" fill="#c2577a"/><text x="572.0" y="323.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">7</text><text x="592.0" y="323.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Refill fatto in ritardo</text><circle cx="572" cy="351" r="12" fill="#c2577a"/><text x="572.0" y="356.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">8</text><text x="592.0" y="356.0" font-size="14.5" text-anchor="start" font-weight="400" fill="#3b2a30">Polimerizzazione incompleta</text><rect x="555" y="380" width="325" height="80" rx="10" fill="#fbe7e4"/><text x="570.0" y="403.0" font-size="15" text-anchor="start" font-weight="600" fill="#c0392b">Mai incollare sopra un sollevamento:</text><text x="570.0" y="421.8" font-size="15" text-anchor="start" font-weight="600" fill="#c0392b">si infiltrano umidità e batteri</text><text x="570.0" y="440.5" font-size="15" text-anchor="start" font-weight="600" fill="#c0392b">(Pseudomonas).</text></svg>
