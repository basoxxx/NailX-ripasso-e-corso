<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Scala delle grane delle lime</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker></defs><text x="40.0" y="40.0" font-size="19" text-anchor="start" font-weight="800" fill="#8e3b5a">Grane delle lime: più il numero è basso, più la lima è aggressiva</text><rect x="60" y="80" width="150" height="46" fill="#5b4a44" rx="0"/><text x="135.0" y="109.0" font-size="16" text-anchor="middle" font-weight="800" fill="#fff">80–100</text><text x="135.0" y="156.0" font-size="14" text-anchor="middle" font-weight="400" fill="#3b2a30">Accorciare, togliere</text><text x="135.0" y="173.5" font-size="14" text-anchor="middle" font-weight="400" fill="#3b2a30">materiale artificiale</text><rect x="210" y="80" width="200" height="46" fill="#8a7469" rx="0"/><text x="310.0" y="109.0" font-size="16" text-anchor="middle" font-weight="800" fill="#fff">100/180</text><text x="310.0" y="156.0" font-size="14" text-anchor="middle" font-weight="400" fill="#3b2a30">Dare forma alla</text><text x="310.0" y="173.5" font-size="14" text-anchor="middle" font-weight="400" fill="#3b2a30">ricostruzione</text><rect x="410" y="80" width="200" height="46" fill="#c3ad9f" rx="0"/><text x="510.0" y="109.0" font-size="16" text-anchor="middle" font-weight="800" fill="#3b2a30">180–240</text><text x="510.0" y="156.0" font-size="14" text-anchor="middle" font-weight="400" fill="#3b2a30">Unghia naturale,</text><text x="510.0" y="173.5" font-size="14" text-anchor="middle" font-weight="400" fill="#3b2a30">opacizzare, rifinire</text><rect x="610" y="80" width="210" height="46" fill="#ece1d8" rx="0"/><text x="715.0" y="109.0" font-size="16" text-anchor="middle" font-weight="800" fill="#3b2a30">240+ / buffer</text><text x="715.0" y="156.0" font-size="14" text-anchor="middle" font-weight="400" fill="#3b2a30">Levigare e</text><text x="715.0" y="173.5" font-size="14" text-anchor="middle" font-weight="400" fill="#3b2a30">lucidare</text><line x1="80.0" y1="210.0" x2="800.0" y2="210.0" stroke="#7a6369" stroke-width="1.6" marker-end="url(#arw)"/><text x="80.0" y="235.0" font-size="13" text-anchor="start" font-weight="400" fill="#7a6369">più abrasiva</text><text x="800.0" y="235.0" font-size="13" text-anchor="end" font-weight="400" fill="#7a6369">più fine</text><rect x="60" y="80" width="760" height="46" fill="none" stroke="#7a6369" rx="4"/><text x="440.0" y="280.0" font-size="14" text-anchor="middle" font-weight="600" fill="#c0392b">Sulla lamina naturale non scendere sotto 180: serve solo togliere la lucidità, mai assottigliare.</text></svg>
