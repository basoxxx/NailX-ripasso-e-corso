5" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Non tagliare la pelle viva</text><circle cx="878.0" cy="120.0" r="14" fill="#c0392b" stroke="#fff" stroke-width="2" filter="url(#nxShS)"/><path d="M873.0,115.0 l10,10 M883.0,115.0 l-10,10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M635,190 L735,190 Q762,190 766,216 L880,220 L635,280 Z" fill="url(#nxSkin)" stroke="#d39c80"/><path d="M720,218 L890,222" stroke="#b9496f" stroke-width="6" stroke-linecap="round"/><g transform="translate(750,180) rotate(-30)"><path d="M0,0 L60,-6 L60,6 Z" fill="url(#nxMetal)"/><path d="M0,0 L60,10 L60,20 Z" fill="#7d8792"/></g><circle cx="752" cy="198" r="22" fill="none" stroke="#c0392b" stroke-width="3"/><text x="762.0" y="315.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">eponichio e pieghe sono vivi: rischio infezioni</text></svg>
