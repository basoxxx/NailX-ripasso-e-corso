<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 345" width="925" height="345" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Gestione corretta della zona cuticolare</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Zona cuticolare: cosa si tocca e cosa no</text><rect x="20" y="60" width="285" height="270" rx="16" fill="#fbf1ee"/><text x="162.5" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Arretra l'eponichio con delicatezza</text><circle cx="278.0" cy="120.0" r="14" fill="#2f8a5b"/><path d="M271.0,120.0 l5,5 l9,-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M35,190 L135,190 Q162,190 166,216 L280,220 L35,280 Z" fill="#f3cdb6" stroke="#d39c80"/><path d="M120,218 L290,222" stroke="#b9496f" stroke-width="6" stroke-linecap="round"/><g transform="translate(172.0,208.0) rotate(-30.0)"><rect x="0" y="-4" width="110" height="8" rx="4" fill="#9aa3ad"/><path d="M0,-4 L-22,-11 L-24,11 L0,4 Z" fill="#7d8792"/></g><line x1="200.0" y1="180.0" x2="170.0" y2="180.0" stroke="#8e3b5a" stroke-width="2.2" marker-end="url(#ar)"/><text x="162.0" y="315.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">lo spingicuticole quasi piatto, senza forza</text><rect x="320" y="60" width="285" height="270" rx="16" fill="#fbf1ee"/><text x="462.5" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Rimuovi la cuticola dalla lamina</text><circle cx="578.0" cy="120.0" 