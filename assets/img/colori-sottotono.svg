<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Cerchio cromatico e scelta del cover in base al sottotono</title><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Colore: cerchio cromatico e scelta del cover</text><path d="M190,210 L130.0,106.1 A120,120 0 0 1 250.0,106.1 Z" fill="#e53935" stroke="#fff" stroke-width="3"/><text x="190.0" y="73.0" font-size="13" text-anchor="middle" font-weight="600" fill="#3b2a30">rosso</text><path d="M190,210 L250.0,106.1 A120,120 0 0 1 310.0,210.0 Z" fill="#fb8c00" stroke="#fff" stroke-width="3"/><text x="313.0" y="144.0" font-size="13" text-anchor="middle" font-weight="600" fill="#3b2a30">arancio</text><path d="M190,210 L310.0,210.0 A120,120 0 0 1 250.0,313.9 Z" fill="#fdd835" stroke="#fff" stroke-width="3"/><text x="313.0" y="286.0" font-size="13" text-anchor="middle" font-weight="600" fill="#3b2a30">giallo</text><path d="M190,210 L250.0,313.9 A120,120 0 0 1 130.0,313.9 Z" fill="#7cb342" stroke="#fff" stroke-width="3"/><text x="190.0" y="357.0" font-size="13" text-anchor="middle" font-weight="600" fill="#3b2a30">verde</text><path d="M190,210 L130.0,313.9 A120,120 0 0 1 70.0,210.0 Z" fill="#1e88e5" stroke="#fff" stroke-width="3"/><text x="67.0" y="286.0" font-size="13" text-anchor="middle" font-weight="600" fill="#3b2a30">blu</text><path d="M190,210 L70.0,210.0 A120,120 0 0 1 130.0,106.1 Z" fill="#8e24aa" stroke="#fff" stroke-width="3"/><text x="67.0" y="144.0" font-size="13" text-anchor="middle" font-weight="600" fill="#3b2a30">viola</text><circle cx="190" cy="210" r="54" fill="#fff"/><text x="190.0" y="204.0" font-size="12" text-anchor="middle" font-weight="700" fill="#3b2a30">colori opposti</text><text x="190.0" y="219.0" font-size="12" text-anchor="middle" font-weight="700" fill="#3b2a30">= complementari</text><text x="190.0" y="372.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#7a6369">viola ↔ giallo: un tocco violaceo attenua il giallo</text><text x="420.0" y="90.0" font-size="15" text-anchor="start" font-weight="700" fill="#3b2a30">Sottotono della pelle → cover consigliato (indicazione pratica)</text><rect x="420" y="120" width="490" height="62" rx="12" fill="#fbf1ee"/><circle cx="452" cy="151" r="20" fill="#f3c6cf" stroke="#d39c80"/><text x="484.0" y="147.0" font-size="15" text-anchor="start" font-weight="800" fill="#3b2a30">Freddo</text><text x="484.0" y="167.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#7a6369">riflessi rosati, vene bluastre</text><rect x="730" y="131" width="40" height="40" rx="8" fill="#f2b3c3"/><text x="780.0" y="156.0" font-size="13.5" text-anchor="start" font-weight="600" fill="#3b2a30">rosa / rosa-beige</text><rect x="420" y="195" width="490" height="62" rx="12" fill="#fbf1ee"/><circle cx="452" cy="226" r="20" fill="#f5c9a8" stroke="#d39c80"/><text x="484.0" y="222.0" font-size="15" text-anchor="start" font-weight="800" fill="#3b2a30">Caldo</text><text x="484.0" y="242.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#7a6369">riflessi dorati, vene verdastre</text><rect x="730" y="206" width="40" height="40" rx="8" fill="#f6c3a6"/><text x="780.0" y="231.0" font-size="13.5" text-anchor="start" font-weight="600" fill="#3b2a30">pesca / nude caldo</text><rect x="420" y="270" width="490" height="62" rx="12" fill="#fbf1ee"/><circle cx="452" cy="301" r="20" fill="#ecc9b6" stroke="#d39c80"/><text x="484.0" y="297.0" font-size="15" text-anchor="start" font-weight="800" fill="#3b2a30">Neutro</text><text x="484.0" y="317.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#7a6369">via di mezzo</text><rect x="730" y="281" width="40" height="40" rx="8" fill="#e9c5b1"/><text x="780.0" y="306.0" font-size="13.5" text-anchor="start" font-weight="600" fill="#3b2a30">nude beige</text><text x="665.0" y="372.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#7a6369">Prova sempre un campione con luce naturale: il colore giusto "sparisce".</text></svg>
