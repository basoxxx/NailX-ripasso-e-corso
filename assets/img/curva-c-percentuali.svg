<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Curva a C del 30, 40 e 50 per cento di un cerchio</title><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Curva a C in percentuale di cerchio</text><circle cx="140" cy="170" r="70" fill="none" stroke="#d9c9c4" stroke-width="2" stroke-dasharray="5 5"/><path d="M83.4,128.9 A70,70 0 0 1 196.6,128.9" fill="none" stroke="#c2577a" stroke-width="13" stroke-linecap="round"/><text x="140.0" y="272.0" font-size="16" text-anchor="middle" font-weight="800" fill="#3b2a30">≈30% bassa</text><circle cx="380" cy="170" r="70" fill="none" stroke="#d9c9c4" stroke-width="2" stroke-dasharray="5 5"/><path d="M313.4,148.4 A70,70 0 0 1 446.6,148.4" fill="none" stroke="#c2577a" stroke-width="13" stroke-linecap="round"/><text x="380.0" y="272.0" font-size="16" text-anchor="middle" font-weight="800" fill="#3b2a30">≈40% salone</text><circle cx="620" cy="170" r="70" fill="none" stroke="#d9c9c4" stroke-width="2" stroke-dasharray="5 5"/><path d="M550.0,170.0 A70,70 0 0 1 690.0,170.0" fill="none" stroke="#c2577a" stroke-width="13" stroke-linecap="round"/><text x="620.0" y="272.0" font-size="16" text-anchor="middle" font-weight="800" fill="#3b2a30">≈50% gara</text><text x="380.0" y="300.0" font-size="14" text-anchor="middle" font-weight="600" fill="#7a6369">Segui sempre la curva naturale della cliente.</text></svg>
