<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Gerarchia della protezione: prodotti, aspirazione, ventilazione, DPI</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">L'ordine della protezione</text><path d="M92.0,64.0 L652.0,64.0 L602.0,142.0 L142.0,142.0 Z" fill="#8e3b5a"/><circle cx="139.2" cy="94" r="14" fill="#fff"/><text x="139.2" y="99.0" font-size="15" text-anchor="middle" font-weight="900" fill="#8e3b5a">1</text><text x="386.0" y="98.0" font-size="17" text-anchor="middle" font-weight="800" fill="#fff">Prodotti conformi e poche scorte</text><text x="386.0" y="120.0" font-size="13" text-anchor="middle" font-weight="600" fill="#fff">etichetta in italiano, flaconi chiusi</text><path d="M142.0,150.0 L602.0,150.0 L552.0,228.0 L192.0,228.0 Z" fill="#c2577a"/><circle cx="189.2" cy="180" r="14" fill="#fff"/><text x="189.2" y="185.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c2577a">2</text><text x="386.0" y="184.0" font-size="17" text-anchor="middle" font-weight="800" fill="#fff">Aspirazione alla fonte</text><text x="386.0" y="206.0" font-size="13" text-anchor="middle" font-weight="600" fill="#fff">tavolo aspirante o cappa vicino alle mani</text><path d="M192.0,236.0 L552.0,236.0 L502.0,314.0 L242.0,314.0 Z" fill="#e48fa9"/><circle cx="239.2" cy="266" r="14" fill="#fff"/><text x="239.2" y="271.0" font-size="15" text-anchor="middle" font-weight="900" fill="#e48fa9">3</text><