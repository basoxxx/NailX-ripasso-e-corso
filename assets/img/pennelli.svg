<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 375" width="940" height="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Tipi di pennelli per la ricostruzione</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d0d7"/><stop offset=".45" stop-color="#9aa3ad"/><stop offset="1" stop-color="#7c8691"/></linearGradient></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">I pennelli e gli strumenti di stesura</text><rect x="84" y="150" width="12" height="130" rx="6" fill="#4b3a40"/><rect x="82" y="128" width="16" height="26" fill="#c9b8a0"/><path d="M82,128 L79,80 L101,80 L98,128 Z" fill="#e9a7bd"/><text x="90.0" y="305.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Piatto per gel</text><text x="90.0" y="324.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">base e costruttore</text><rect x="236" y="150" width="12" height="130" rx="6" fill="#4b3a40"/><rect x="234" y="128" width="16" height="26" fill="#c9b8a0"/><path d="M234,128 C230,100 236,80 242,78 C248,80 254,100 250,128 Z" fill="#e9a7bd"/><text x="242.0" y="305.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Ovale / tondo</text><text x="242.0" y="324.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">gel, zona cuticolare</text><rect x="388" y="150" width="12" height="130" rx="6" fill="#4b3a40"/><rect x="386" y="128" width="16" height="26" fill="#c9b8a0"/><path d="M386,128 C378,100 386,82 394,70 C402,82 410,100 402,128 Z" fill="#f3eee6" stroke="#cbbfae"/><text x="394.0" y="305.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Acrilico 8–12</text><text x="394.0" y="324.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">raccoglie la perla</text><rect x="540" y="150" width="12" height="130" rx="6" fill="#4b3a40"/><rect x="538" y="128" width="16" height="26" fill="#c9b8a0"/><path d="M543,128 L545,60 L547,60 L549,128 Z" fill="#3b2a30"/><text x="546.0" y="305.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Liner / striper</text><text x="546.0" y="324.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">linee e dettagli</text><rect x="692" y="150" width="12" height="130" rx="6" fill="#4b3a40"/><rect x="690" y="128" width="16" height="26" fill="#c9b8a0"/><path d="M694,128 L662,80 Q698,66 734,80 Z" fill="#f3eee6" stroke="#cbbfae"/><path d="M702,128 L668,80 Q698,66 728,80 Z" fill="none" stroke="#cbbfae"/><text x="698.0" y="305.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Ventaglio</text><text x="698.0" y="324.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">polveri e glitter</text><rect x="844" y="150" width="12" height="130" rx="6" fill="#4b3a40"/><rect x="842" y="128" width="16" height="26" fill="#c9b8a0"/><path d="M850,128 L850,70" stroke="#9aa3ad" stroke-width="3"/><circle cx="850" cy="68" r="7" fill="url(#nxMetal)"/><text x="850.0" y="305.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Dotter</text><text x="850.0" y="324.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">puntini</text><text x="470.0" y="360.0" font-size="13" text-anchor="middle" font-weight="400" fill="#7a6369">Pulisci i pennelli per gel con il cleaner e quelli per acrilico con il monomero; conservali al riparo dalla luce.</text></svg>
