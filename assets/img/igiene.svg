<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Detersione, disinfezione e sterilizzazione</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker></defs><text x="40.0" y="40.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">I tre livelli di trattamento igienico</text><rect x="70.0" y="290" width="760" height="82" rx="12" fill="#f8dfe7"/><text x="450.0" y="318.0" font-size="17" text-anchor="middle" font-weight="800" fill="#3b2a30">Detersione / sanificazione</text><text x="450.0" y="340.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#3b2a30">Riduce sporco e carica microbica</text><text x="450.0" y="360.0" font-size="13" text-anchor="middle" font-weight="400" fill="#3b2a30" font-style="italic">Per: mani, superfici, lime monouso</text><rect x="150.0" y="195" width="600" height="82" rx="12" fill="#eeaabf"/><text x="450.0" y="223.0" font-size="17" text-anchor="middle" font-weight="800" fill="#3b2a30">Disinfezione</text><text x="450.0" y="245.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#3b2a30">Elimina la maggior parte dei patogeni</text><text x="450.0" y="265.0" font-size="13" text-anchor="middle" font-weight="400" fill="#3b2a30" font-style="italic">Per: strumenti non sterilizzabili, superfici</text><rect x="230.0" y="100" width="440" height="82" rx="12" fill="#c2577a"/><text x="450.0" y="128.0" font-size="17" text-anchor="middle" font-weight="800" fill="#fff">Sterilizzazione</text><text x="450.0" y="150.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#fff">Elimina ogni forma di vita, spore incluse</text><text x="450.0" y="170.0" font-size="13" text-anchor="middle" font-weight="400" fill="#fff" font-style="italic">Per: autoclave classe B (EN 13060), con tracciabilità</text><line x1="860.0" y1="360.0" x2="860.0" y2="110.0" stroke="#7a6369" stroke-width="1.6" marker-end="url(#arw)"/><text x="850.0" y="100.0" font-size="13" text-anchor="end" font-weight="400" fill="#7a6369">più efficace</text></svg>
