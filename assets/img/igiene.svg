asse B (EN 13060), con tracciabilità</text><defs><linearGradient id="lg9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e3b5a"/><stop offset="1" stop-color="#f3d3dd"/></linearGradient></defs><rect x="862" y="104" width="10" height="266" rx="5" fill="url(#lg9)"/><path d="M856,108 L867,88 L878,108 Z" fill="#8e3b5a"/><text x="880.0" y="76.0" font-size="13" text-anchor="end" font-weight="700" fill="#8e3b5a">più efficace</text><text x="30.0" y="396.0" font-size="13" text-anchor="start" font-weight="400" fill="#7a6369">Si procede sempre dal basso: prima si pulisce, poi si disinfetta o si sterilizza.</text></svg>
