<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Detersione, disinfezione e sterilizzazione: tre livelli di efficacia crescente</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d0d7"/><stop offset=".45" stop-color="#9aa3ad"/><stop offset="1" stop-color="#7c8691"/></linearGradient><filter id="nxSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#5a2a3a" flood-opacity=".13"/></filter></defs><text x="30.0" y="40.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">I tre livelli di trattamento igienico</text><rect x="50.0" y="282" width="780" height="88" rx="14" fill="#f9e6ec" stroke="#e7bfcc" stroke-width="1.2" filter="url(#nxSh)"/><circle cx="102.0" cy="326" r="34" fill="#fff" stroke="#e7bfcc" stroke-width="1.5"/><g transform="translate(102.0,326) scale(.78)"><ellipse cx="0" cy="27" rx="30" ry="4" fill="#000" opacity=".08"/><rect x="-15" y="-6" width="30" height="33" rx="7" fill="#e6f2fa" stroke="#7fa8c2" stroke-width="1.6"/><rect x="-11" y="4" width="22" height="19" rx="5" fill="#bcdcef"/><rect x="-9" y="-1" width="4" height="22" rx="2" fill="#fff" opacity=".7"/><rect x="-6" y="-13" width="12" height="8" rx="2" fill="#5f8fae"/><rect x="-3" y="-21" width="6" height="9" fill="#5f8fae"/><path d="M-6,-24 L16,-24 L16,-19 L10,-19 L10,-21 L-6,-21 Z" fill="#4b7896"/><circle cx="22" cy="-8" r="5.0" fill="#fff" stroke="#9cc3dc" stroke-width="1.2"/><circle cx="20.2" cy="-9.8" r="1.2" fill="#9cc3dc" opacity=".6"/><circle cx="27" cy="4" r="3.5" fill="#fff" stroke="#9cc3dc" stroke-width="1.2"/><circle cx="25.8" cy="2.8" r="0.9" fill="#9cc3dc" opacity=".6"/><circle cx="19" cy="10" r="2.6" fill="#fff" stroke="#9cc3dc" stroke-width="1.2"/><circle cx="18.1" cy="9.1" r="0.7" fill