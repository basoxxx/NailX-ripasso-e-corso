<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Confronto tra gel, acrilico, polygel e fibra</title><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="40.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">I sistemi di ricostruzione a confronto</text><rect x="20" y="60" width="210" height="300" rx="16" fill="#fbf1ee"/><text x="125.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Gel UV/LED</text><rect x="95" y="110" width="60" height="80" rx="10" fill="#e9a7bd"/><rect x="105" y="100" width="40" height="18" rx="4" fill="#4b3a40"/><text x="125.0" y="218.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#7a6369">flacone/vasetto + lampada</text><text x="125.0" y="255.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#2f8a5b">+ nessun odore</text><text x="125.0" y="281.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#2f8a5b">+ autolivellante</text><text x="125.0" y="307.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#c0392b">− rischio picco di calore</text><rect x="245" y="60" width="210" height="300" rx="16" fill="#fbf1ee"/><text x="350.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Acrilico</text><path d="M300,110 l40,0 l-6,80 l-28,0 z" fill="#e8f3fb" stroke="#9cc3dc"/><rect x="355" y="140" width="50" height="50" rx="8" fill="#f8e8ee" stroke="#b9496f"/><text x="350.0" y="218.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#7a6369">liquido (monomero) + polvere</text><text x="350.0" y="255.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#2f8a5b">+ il più resistente</text><text x="350.0" y="281.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#2f8a5b">+ ottimo per lunghezze</text><text x="350.0" y="307.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#c0392b">− odore e vapori</text><rect x="470" y="60" width="210" height="300" rx="16" fill="#fbf1ee"/><text x="575.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Polygel</text><rect x="564" y="110" width="22" height="80" rx="6" fill="#e9a7bd"/><path d="M564,110 l11,-14 l11,14 z" fill="#4b3a40"/><text x="575.0" y="218.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#7a6369">pasta + slip solution + lampada</text><text x="575.0" y="255.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#2f8a5b">+ tempo di lavoro libero</text><text x="575.0" y="281.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#2f8a5b">+ leggero</text><text x="575.0" y="307.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#c0392b">− curva di apprendimento</text><rect x="695" y="60" width="210" height="300" rx="16" fill="#fbf1ee"/><text x="800.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Fibra / seta</text><line x1="765" y1="110" x2="835" y2="110" stroke="#d8cbb5" stroke-width="2"/><line x1="765" y1="120" x2="835" y2="120" stroke="#d8cbb5" stroke-width="2"/><line x1="765" y1="130" x2="835" y2="130" stroke="#d8cbb5" stroke-width="2"/><line x1="765" y1="140" x2="835" y2="140" stroke="#d8cbb5" stroke-width="2"/><line x1="765" y1="150" x2="835" y2="150" stroke="#d8cbb5" stroke-width="2"/><line x1="765" y1="160" x2="835" y2="160" stroke="#d8cbb5" stroke-width="2"/><line x1="765" y1="170" x2="835" y2="170" stroke="#d8cbb5" stroke-width="2"/><line x1="765" y1="180" x2="835" y2="180" stroke="#d8cbb5" stroke-width="2"/><line x1="765" y1="110" x2="765" y2="180" stroke="#d8cbb5" stroke-width="2"/><line x1="775" y1="110" x2="775" y2="180" stroke="#d8cbb5" stroke-width="2"/><line x1="785" y1="110" x2="785" y2="180" stroke="#d8cbb5" stroke-width="2"/><line x1="795" y1="110" x2="795" y2="180" stroke="#d8cbb5" stroke-width="2"/><line x1="805" y1="110" x2="805" y2="180" stroke="#d8cbb5" stroke-width="2"/><line x1="815" y1="110" x2="815" y2="180" stroke="#d8cbb5" stroke-width="2"/><line x1="825" y1="110" x2="825" y2="180" stroke="#d8cbb5" stroke-width="2"/><line x1="835" y1="110" x2="835" y2="180" stroke="#d8cbb5" stroke-width="2"/><text x="800.0" y="218.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#7a6369">tessuto + resina + attivatore</text><text x="800.0" y="255.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#2f8a5b">+ sottile e naturale</text><text x="800.0" y="281.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#2f8a5b">+ riparazioni</text><text x="800.0" y="307.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#c0392b">− meno strutturale</text></svg>
