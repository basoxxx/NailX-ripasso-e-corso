<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Perla di acrilico bagnata, media e asciutta</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6f3"/><stop offset="1" stop-color="#f8ece8"/></linearGradient><filter id="nxSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#5a2a3a" flood-opacity=".13"/></filter><filter id="nxShS" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#3b2a30" flood-opacity=".25"/></filter></defs><text x="40.0" y="40.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Rapporto liquido/polvere: la "perla" di acrilico</text><rect x="20" y="60" width="280" height="290" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="160.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Bagnata</text><circle cx="270.0" cy="88.0" r="14" fill="#c0392b" stroke="#fff" stroke-width="2" filter="url(#nxShS)"/><path d="M265.0,83.0 l10,10 M275.0,83.0 l-10,10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect x="60" y="230" width="200" height="10" rx="5" fill="#d9cfc6"/><path d="M75,230 Q140,208 190,212 Q240,224 250,230 Z" fill="#f8e8ee" stroke="#b9496f"/><path d="M230,238 q4,14 0,22 q-4,-8 0,-22" fill="#f8e8ee" stroke="#b9496f"/><g transform="translate(190.0,145.0) rotate(-40.0)"><rect x="18" y="-5" width="90" height="10" rx="5" fill="#4b3a40"/><rect x="10" y="-6" width="12" height="12" fill="#c9b8a0"/><path d="M10,-6 L-14,-4 Q-20,0 -14,4 L10,6 Z" fill="#f3eee6"/></g><text x="160.0" y="285.0" font-size="18" text-anchor="middle" font-weight="800" fill="#8e3b5a">≈ 2 : 1</text><text x="160.0" y="310.0" font-size="13" text-anchor="middle" font-weight="400" fill="#7a6369">cola nei solchi, ritira,</text><text x="160.0" y="326.2" font-size="13" text-anchor="middle" font-weight="400" fill="#7a6369">monomero a contatto con la pelle</text><rect x="320" y="60" width="280" height="290" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="460.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Media</text><circle cx="570.0" cy="88.0" r="14" fill="#2f8a5b" stroke="#fff" stroke-width="2" filter="url(#nxShS)"/><path d="M563.0,88.0 l5,5 l9,-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="230" width="200" height="10" rx="5" fill="#d9cfc6"/><path d="M415,230 C415,160 505,160 505,230 Z" fill="#f8e8ee" stroke="#b9496f"/><ellipse cx="446" cy="192" rx="12" ry="7" fill="#fff"/><g transform="translate(490.0,145.0) rotate(-40.0)"><rect x="18" y="-5" width="90" height="10" rx="5" fill="#4b3a40"/><rect x="10" y="-6" width="12" height="12" fill="#c9b8a0"/><path d="M10,-6 L-14,-4 Q-20,0 -14,4 L10,6 Z" fill="#f3eee6"/></g><text x="460.0" y="285.0" font-size="18" text-anchor="middle" font-weight="800" fill="#8e3b5a">≈ 1,5 : 1</text><text x="460.0" y="310.0" font-size="13" text-anchor="middle" font-weight="400" fill="#7a6369">lucida e bombata, resta in</text><text x="460.0" y="326.2" font-size="13" text-anchor="middle" font-weight="400" fill="#7a6369">forma qualche secondo</text><rect x="620" y="60" width="280" height="290" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="760.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Asciutta</text><circle cx="870.0" cy="88.0" r="14" fill="#c0392b" stroke="#fff" stroke-width="2" filter="url(#nxShS)"/><path d="M865.0,83.0 l10,10 M875.0,83.0 l-10,10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect x="660" y="230" width="200" height="10" rx="5" fill="#d9cfc6"/><polygon points="724.0,230.0 715.6,219.3 728.8,213.8 727.5,200.7 742.0,201.9 748.1,190.0 760.0,197.6 771.9,190.0 778.0,201.9 792.5,200.7 791.2,213.8 804.4,219.3 796.0,230.0" fill="#efe4e8" stroke="#b9496f"/><circle cx="732" cy="222" r="2" fill="#cfbfc4"/><circle cx="749" cy="211" r="2" fill="#cfbfc4"/><circle cx="766" cy="200" r="2" fill="#cfbfc4"/><circle cx="783" cy="215" r="2" fill="#cfbfc4"/><circle cx="744" cy="204" r="2" fill="#cfbfc4"/><circle cx="761" cy="219" r="2" fill="#cfbfc4"/><circle cx="778" cy="208" r="2" fill="#cfbfc4"/><circle cx="739" cy="197" r="2" fill="#cfbfc4"/><circle cx="756" cy="212" r="2" fill="#cfbfc4"/><circle cx="773" cy="201" r="2" fill="#cfbfc4"/><circle cx="734" cy="216" r="2" fill="#cfbfc4"/><circle cx="751" cy="205" r="2" fill="#cfbfc4"/><circle cx="768" cy="220" r="2" fill="#cfbfc4"/><circle cx="785" cy="209" r="2" fill="#cfbfc4"/><g transform="translate(790.0,145.0) rotate(-40.0)"><rect x="18" y="-5" width="90" height="10" rx="5" fill="#4b3a40"/><rect x="10" y="-6" width="12" height="12" fill="#c9b8a0"/><path d="M10,-6 L-14,-4 Q-20,0 -14,4 L10,6 Z" fill="#f3eee6"/></g><text x="760.0" y="285.0" font-size="18" text-anchor="middle" font-weight="800" fill="#8e3b5a">≈ 1 : 1</text><text x="760.0" y="310.0" font-size="13" text-anchor="middle" font-weight="400" fill="#7a6369">granulosa e opaca: poca</text><text x="760.0" y="326.2" font-size="13" text-anchor="middle" font-weight="400" fill="#7a6369">adesione, bolle e porosità</text></svg>
