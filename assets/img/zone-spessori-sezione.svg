<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="940" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Spessori della ricostruzione in sezione longitudinale e trasversale</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxSkin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2b29b"/><stop offset=".22" stop-color="#f3cdb6"/><stop offset=".55" stop-color="#f8dccb"/><stop offset=".82" stop-color="#f1c7af"/><stop offset="1" stop-color="#dfac94"/></linearGradient><linearGradient id="nxNail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbd6e0"/><stop offset=".45" stop-color="#f7c1cf"/><stop offset="1" stop-color="#eeaabd"/></linearGradient><linearGradient id="nxFree" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbeef2"/></linearGradient><linearGradient id="nxPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6f3"/><stop offset="1" stop-color="#f8ece8"/></linearGradient><filter id="nxSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#5a2a3a" flood-opacity=".13"/></filter></defs><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Dove il prodotto è spesso e dove è sottile</text><rect x="20" y="60" width="580" height="290" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="310.0" y="88.0" font-size="15" text-anchor="middle" font-weight="700" fill="#3b2a30">Sezione longitudinale (di profilo)</text><path d="M30.0,206.0 L132.0,206.0 Q146.0,206.0 150.0,218.0 L330.0,225.0 C346.0,228.0 350.0,264.0 328.0,282.0 C306.0,300.0 80.0,300.0 30.0,300.0 Z" fill="url(#nxSkin)" stroke="#d39c80" stroke-width="1.5"/><path d="M144.0,220.0 L330.0,221.0 L330.0,226.0 L146.0,225.0 Z" fill="url(#nxNail)" stroke="#b9496f" stroke-width="1.4"/><path d="M330.0,221.0 L350.0,221.0 L350.0,226.0 L330.0,226.0 Z" fill="url(#nxFree)" stroke="#b9496f" stroke-width="1.4"/><path d="M100.0,207.0 L132.0,207.0 Q148.0,207.0 152.0,219.0 L100.0,219.0 Z" fill="url(#nxSkin)"/><path d="M132.0,206.0 Q148.0,206.0 152.0,219.0" fill="none" stroke="#d39c80" stroke-width="1.5"/><path d="M154.0,219.0 Q239.0,184.0 324.0,184.0 Q437.0,184.0 510.0,216.0 L510.0,225.0 L350.0,226.0 L350.0,219.0 L154.0,219.0 Z" fill="#d6ebf6" stroke="#7fb0cc" stroke-width="1.6" opacity=".92"/><circle cx="330.0" cy="226.0" r="5" fill="#c0392b"/><line x1="330.0" y1="226.0" x2="340.0" y2="324.0" stroke="#7a6369" stroke-width="1.3"/><circle cx="330.0" cy="226.0" r="3.5" fill="#8e3b5a"/><text x="340.0" y="329.0" font-size="13" text-anchor="middle" font-weight="600" fill="#c0392b">punto di stress</text><circle cx="194.0" cy="122" r="13" fill="#8e3b5a"/><text x="194.0" y="127.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">3</text><circle cx="324.0" cy="122" r="13" fill="#8e3b5a"/><text x="324.0" y="127.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">2</text><circle cx="450.0" cy="122" r="13" fill="#8e3b5a"/><text x="450.0" y="127.0" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">1</text><line x1="324.0" y1="140.0" x2="324.0" y2="181.0" stroke="#8e3b5a" stroke-width="2.2" marker-end="url(#ar)"/><text x="344.0" y="150.0" font-size="13.5" text-anchor="start" font-weight="800" fill="#8e3b5a">apex</text><line x1="142.0" y1="202.0" x2="156.0" y2="202.0" stroke="#8e3b5a" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="149.0" y="195.0" font-size="13" text-anchor="middle" font-weight="700" fill="#8e3b5a"></text><text x="136.0" y="188.0" font-size="12.5" text-anchor="end" font-weight="700" fill="#8e3b5a">≈ 1 mm dalla pelle</text><line x1="524.0" y1="215.0" x2="524.0" y2="226.0" stroke="#8e3b5a" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="532.0" y="225.5" font-size="13" text-anchor="start" font-weight="700" fill="#8e3b5a"></text><text x="506.0" y="254.0" font-size="13" text-anchor="middle" font-weight="800" fill="#8e3b5a">≈ 1–1,5 mm</text><rect x="440.0" y="266.0" width="40" height="26" rx="4" fill="#cfe0f0" stroke="#7fb0cc"/><rect x="440.0" y="272.0" width="40" height="6" fill="#7fb0cc"/><text x="486.0" y="276.0" font-size="12" text-anchor="start" font-weight="600" fill="#7a6369">come una carta</text><text x="486.0" y="291.0" font-size="12" text-anchor="start" font-weight="600" fill="#7a6369">di credito</text><rect x="620" y="60" width="300" height="290" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="770.0" y="88.0" font-size="15" text-anchor="middle" font-weight="700" fill="#3b2a30">Sezione trasversale</text><text x="770.0" y="106.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#7a6369">(vista dalla punta)</text><path d="M660,250 Q770,100 880,250 L870,252 Q770,146 670,252 Z" fill="#d6ebf6" stroke="#7fb0cc" stroke-width="1.6"/><path d="M670,256 Q770,152 870,256" fill="none" stroke="#b9496f" stroke-width="7" stroke-linecap="round"/><line x1="770.0" y1="198.0" x2="770.0" y2="174.0" stroke="#8e3b5a" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="778.0" y="191.0" font-size="13" text-anchor="start" font-weight="700" fill="#8e3b5a"></text><text x="780.0" y="146.0" font-size="13" text-anchor="start" font-weight="700" fill="#8e3b5a">centro più spesso</text><text x="770.0" y="290.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#3b2a30">lati sottili e uguali</text><line x1="700.0" y1="272.0" x2="670.0" y2="252.0" stroke="#7a6369" stroke-width="1.4" marker-end="url(#arw)"/><line x1="840.0" y1="272.0" x2="870.0" y2="252.0" stroke="#7a6369" stroke-width="1.4" marker-end="url(#arw)"/></svg>
