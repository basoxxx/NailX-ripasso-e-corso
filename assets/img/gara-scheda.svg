600" fill="#3b2a30">Apex nella stessa posizione</text><circle cx="420" cy="189" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="442" cy="189" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="464" cy="189" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="486" cy="189" r="8" fill="#fff" stroke="#c2577a"/><circle cx="508" cy="189" r="8" fill="#fff" stroke="#c2577a"/><rect x="30" y="207" width="500" height="34" rx="6" fill="#fbf4f2"/><text x="40.0" y="230.0" font-size="15" text-anchor="start" font-weight="600" fill="#3b2a30">Bordo libero sottile e uniforme</text><circle cx="420" cy="225" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="442" cy="225" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="464" cy="225" r="8" fill="#fff" stroke="#c2577a"/><circle cx="486" cy="225" r="8" fill="#fff" stroke="#c2577a"/><circle cx="508" cy="225" r="8" fill="#fff" stroke="#c2577a"/><text x="40.0" y="266.0" font-size="15" text-anchor="start" font-weight="600" fill="#3b2a30">Smile line simmetrica</text><circle cx="420" cy="261" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="442" cy="261" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="464" cy="261" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="486" cy="261" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="508" cy="261" r="8" fill="#fff" stroke="#c2577a"/><rect x="30" y="279" width="500" height="34" rx="6" fill="#fbf4f2"/><text x="40.0" y="302.0" font-size="15" text-anchor="start" font-weight="600" fill="#3b2a30">Zona cuticolare pulita</text><circle cx="420" cy="297" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="442" cy="297" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="464" cy="297" r="8" fill="#c2577a" stroke="#c2577a"/><circle cx="486" cy="297" r="8" fill="#fff" stroke="#c2577a"/><circle cx="508" cy="297" r="8" fill="#fff" stroke="#c2577a"/><text x="40.0" y="338.0" font-size="15" text-anchor="start" font-weight="600" fill="#3b2a30">Superficie lucida, senza graffi</text><circle cx="420" cy="333" r="