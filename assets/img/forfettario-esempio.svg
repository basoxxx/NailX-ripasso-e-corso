<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" width="900" height="316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Esempio di regime forfettario: incassi 30.000 euro, reddito 67% pari a 20.100 euro, contributi e imposta</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="are" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="aro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a5b"/></marker><marker id="arwn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="arv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6be0"/></marker></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Forfettario: esempio</text><text x="40.0" y="74.0" font-size="16" text-anchor="start" font-weight="800" fill="#3b2a30">Incassi 30.000 €</text><rect x="40" y="86" width="549.4" height="56" rx="10" fill="#c2577a"/><rect x="589.4" y="86" width="270.6" height="56" fill="#e2dcde"/><rect x="40" y="86" width="820" height="56" rx="10" fill="none" stroke="#fff" stroke-width="0"/><text x="314.7" y="111.0" font-size="17" text-anchor="middle" font-weight="800" fill="#fff">67% = reddito 20.100 €</text><text x="314.7" y="131.0" font-size="13" text-anchor="middle" font-weight="600" fill="#fff">su questo si calcolano contributi e imposta</text><text x="724.7" y="111.0" font-size="16" text-anchor="middle" font-weight="800" fill="#3b2a30">33% = 9.900 €</text><text x="724.7" y="131.0" font-size="13" text-anchor="middle" font-weight="600" fill="#7a6369">costi forfettari, non tassati</text><line x1="200.0" y1="146.0" x2="160.0" y2="200.0" stroke="#555555" stroke-width="2.2" marker-end="url(#ag)"/><line x1="440.0" y1="146.0" x2="470.0" y2="200.0" stroke="#555555" stroke-width="2.2" marker-end="url(#ag)"/><rect x="40.0" y="204.0" width="300.0" height="62.0" rx="12" fill="#fbf1ee" stroke="#fbf1ee" stroke-width="1.5"/><text x="190.0" y="231.0" font-size="15.5" text-anchor="middle" font-weight="800" fill="#3b2a30">Contributi INPS</text><text x="190.0" y="250.2" font-size="15.5" text-anchor="middle" font-weight="800" fill="#3b2a30">fissi + %</text><rect x="340.0" y="204.0" width="280.0" height="62.0" rx="12" fill="#fbf1ee" stroke="#fbf1ee" stroke-width="1.5"/><text x="480.0" y="231.0" font-size="15.5" text-anchor="middle" font-weight="800" fill="#3b2a30">Imposta sostitutiva</text><text x="480.0" y="250.2" font-size="15.5" text-anchor="middle" font-weight="800" fill="#3b2a30">5% (nuova attività) o 15%</text><rect x="630.0" y="204.0" width="230.0" height="62.0" rx="12" fill="#fbe7e4" stroke="#efc4bd" stroke-width="1.5"/><text x="745.0" y="231.2" font-size="14.5" text-anchor="middle" font-weight="800" fill="#c0392b">Le spese reali</text><text x="745.0" y="249.2" font-size="14.5" text-anchor="middle" font-weight="800" fill="#c0392b">non si scaricano</text><text x="450.0" y="300.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#7a6369">Numeri semplificati, regole 2026: chiedi conferma al commercialista.</text></svg>
