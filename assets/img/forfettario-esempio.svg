ddle" font-weight="800" fill="#3b2a30">Contributi INPS</text><text x="171.0" y="258.0" font-size="15" text-anchor="middle" font-weight="700" fill="#8e3b5a">fissi + %</text><rect x="318.0" y="204.0" width="262.0" height="72.0" rx="14" fill="#fff" stroke="#ead9d4" stroke-width="1.2" filter="url(#cSh)"/><clipPath id="cc140"><rect x="318.0" y="204.0" width="262.0" height="72.0" rx="14"/></clipPath><rect x="318.0" y="204.0" width="262.0" height="5.0" fill="#c2577a" clip-path="url(#cc140)"/><text x="449.0" y="236.0" font-size="16" text-anchor="middle" font-weight="800" fill="#3b2a30">Imposta sostitutiva</text><text x="449.0" y="258.0" font-size="15" text-anchor="middle" font-weight="700" fill="#8e3b5a">5% (nuova attività) o 15%</text><line x1="728.7" y1="154.0" x2="728.7" y2="202.0" stroke="#7a6369" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="597.4" y="204" width="262.6" height="72" rx="14" fill="#fbe7e4" stroke="#efc4bd" stroke-width="1.4"/><circle cx="625.4" cy="240.0" r="13" fill="#c0392b" stroke="#fff" stroke-width="2" filter="url(#nxShS)"/><path d="M620.4,235.0 l10,10 M630.4,235.0 l-10,10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="647.4" y="236.0" font-size="15" text-anchor="start" font-weight="800" fill="#c0392b">Le spese reali</text><text x="647.4" y="256.0" font-size="15" text-anchor="start" font-weight="800" fill="#c0392b">non si scaricano</text><text x="450.0" y="318.0" font-size="14.5" text-anchor="middle" font-weight="400" fill="#7a6369" font-style="italic">Numeri semplificati, regole 2026: chiedi conferma al commercialista.</text></svg>
