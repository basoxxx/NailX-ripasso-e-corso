<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Punte per fresa elettrica, codici colore e velocità</title><rect width="100%" height="100%" fill="#ffffff"/><text x="40.0" y="40.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Punte per fresa: forme, colori e velocità</text><rect x="85" y="160" width="10" height="70" fill="#b8bfc6"/><g transform="translate(90,160)" fill="#9aa3ad" stroke="#6f7a85" stroke-width="1.5"><rect x="-14" y="-50" width="28" height="50" rx="3"/></g><text x="90.0" y="255.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Cilindro</text><text x="90.0" y="274.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">superficie,</text><text x="90.0" y="289.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">accorciare</text><rect x="225" y="160" width="10" height="70" fill="#b8bfc6"/><g transform="translate(230,160)" fill="#9aa3ad" stroke="#6f7a85" stroke-width="1.5"><rect x="-14" y="-50" width="28" height="50" rx="12"/></g><text x="230.0" y="255.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Cil. sicurezza</text><text x="230.0" y="274.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">bordo liscio:</text><text x="230.0" y="289.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">lati e cuticola</text><rect x="365" y="160" width="10" height="70" fill="#b8bfc6"/><g transform="translate(370,160)" fill="#9aa3ad" stroke="#6f7a85" stroke-width="1.5"><path d="M-14,0 L-3,-56 L3,-56 L14,0 Z"/></g><text x="370.0" y="255.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Cono</text><text x="370.0" y="274.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">sotto il bordo</text><text x="370.0" y="289.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">libero, lati</text><rect x="505" y="160" width="10" height="70" fill="#b8bfc6"/><g transform="translate(510,160)" fill="#9aa3ad" stroke="#6f7a85" stroke-width="1.5"><path d="M-9,0 C-14,-20 -6,-44 0,-58 C6,-44 14,-20 9,0 Z"/></g><text x="510.0" y="255.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Fiamma</text><text x="510.0" y="274.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">zona cuticolare,</text><text x="510.0" y="289.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">cuticola</text><rect x="645" y="160" width="10" height="70" fill="#b8bfc6"/><g transform="translate(650,160)" fill="#9aa3ad" stroke="#6f7a85" stroke-width="1.5"><circle cx="0" cy="-12" r="12"/></g><text x="650.0" y="255.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Pallina</text><text x="650.0" y="274.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">pulizia cuticole</text><text x="650.0" y="289.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">e solchi</text><rect x="785" y="160" width="10" height="70" fill="#b8bfc6"/><g transform="translate(790,160)" fill="#9aa3ad" stroke="#6f7a85" stroke-width="1.5"><rect x="-15" y="-46" width="30" height="46" rx="4" fill="#cdb79e"/></g><text x="790.0" y="255.0" font-size="14" text-anchor="middle" font-weight="700" fill="#3b2a30">Mandrino</text><text x="790.0" y="274.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">con rullino</text><text x="790.0" y="289.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">abrasivo monouso</text><text x="40.0" y="330.0" font-size="15" text-anchor="start" font-weight="700" fill="#3b2a30">Codice colore della grana (indicativo, varia tra marchi)</text><rect x="60" y="335" width="34" height="18" rx="4" fill="#f2c94c"/><text x="102.0" y="349.0" font-size="14" text-anchor="start" font-weight="400" fill="#3b2a30">Extra fine</text><rect x="220" y="335" width="34" height="18" rx="4" fill="#e05252"/><text x="262.0" y="349.0" font-size="14" text-anchor="start" font-weight="400" fill="#3b2a30">Fine</text><rect x="380" y="335" width="34" height="18" rx="4" fill="#4a7fd4"/><text x="422.0" y="349.0" font-size="14" text-anchor="start" font-weight="400" fill="#3b2a30">Media</text><rect x="540" y="335" width="34" height="18" rx="4" fill="#3aa35b"/><text x="582.0" y="349.0" font-size="14" text-anchor="start" font-weight="400" fill="#3b2a30">Grossa</text><rect x="700" y="335" width="34" height="18" rx="4" fill="#333333"/><text x="742.0" y="349.0" font-size="14" text-anchor="start" font-weight="400" fill="#3b2a30">Extra grossa</text><text x="40.0" y="400.0" font-size="15" text-anchor="start" font-weight="700" fill="#3b2a30">Velocità indicative (RPM)</text><text x="270.0" y="435.0" font-size="14" text-anchor="end" font-weight="400" fill="#3b2a30">Cuticola / unghia naturale</text><rect x="290" y="420" width="520" height="20" rx="10" fill="#f0e6e2"/><rect x="376.7" y="420" width="86.7" height="20" rx="10" fill="#2f8a5b"/><text x="471.3" y="435.0" font-size="13" text-anchor="start" font-weight="600" fill="#3b2a30">5.000–10.000</text><text x="270.0" y="469.0" font-size="14" text-anchor="end" font-weight="400" fill="#3b2a30">Sfumare la superficie</text><rect x="290" y="454" width="520" height="20" rx="10" fill="#f0e6e2"/><rect x="463.3" y="454" width="86.7" height="20" rx="10" fill="#b7791f"/><text x="558.0" y="469.0" font-size="13" text-anchor="start" font-weight="600" fill="#3b2a30">10.000–15.000</text><text x="270.0" y="503.0" font-size="14" text-anchor="end" font-weight="400" fill="#3b2a30">Rimuovere prodotto</text><rect x="290" y="488" width="520" height="20" rx="10" fill="#f0e6e2"/><rect x="550.0" y="488" width="173.3" height="20" rx="10" fill="#c0392b"/><text x="731.3" y="503.0" font-size="13" text-anchor="start" font-weight="600" fill="#3b2a30">15.000–25.000</text><text x="450.0" y="540.0" font-size="13" text-anchor="middle" font-weight="400" fill="#7a6369">Carburo solo su prodotto artificiale · diamantate su unghia naturale e cuticola · pressione leggera, punta sempre in movimento</text></svg>
