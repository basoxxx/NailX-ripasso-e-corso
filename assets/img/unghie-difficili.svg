<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Unghia a cucchiaio, ski-jump, a pinza e piatta</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6f3"/><stop offset="1" stop-color="#f8ece8"/></linearGradient><filter id="nxSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#5a2a3a" flood-opacity=".13"/></filter></defs><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Unghie difficili: riconoscerle e adattare la costruzione</text><rect x="20" y="60" width="210" height="288" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="125.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">A cucchiaio (coilonichia)</text><defs><linearGradient id="sv197" gradientUnits="userSpaceOnUse" x1="0.0" y1="180.0" x2="0.0" y2="246.0"><stop offset="0" stop-color="#f8dccb"/><stop offset=".45" stop-color="#f3cdb6"/><stop offset="1" stop-color="#dba98f"/></linearGradient></defs><path d="M28.0,181.0 L76.0,181.0 Q92.0,182.0 94.0,190.0 L170.0,195.0 C190.0,195.0 200.0,204.0 200.0,213.5 C200.0,237.6 170.0,246.0 120.0,246.0 L28.0,246.0 Z" fill="url(#sv197)" stroke="#d39c80" stroke-width="1.5"/><path d="M164.0,196.0 Q176.0,196.0 180.0,202.0" stroke="#e3a08a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M50.0,181.0 L76.0,181.0 Q92.0,182.0