<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="940" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Unghia a cucchiaio, ski-jump, a pinza e piatta</title><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="nxSkin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2b29b"/><stop offset=".22" stop-color="#f3cdb6"/><stop offset=".55" stop-color="#f8dccb"/><stop offset=".82" stop-color="#f1c7af"/><stop offset="1" stop-color="#dfac94"/></linearGradient><linearGradient id="nxPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6f3"/><stop offset="1" stop-color="#f8ece8"/></linearGradient><filter id="nxSh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#5a2a3a" flood-opacity=".13"/></filter></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Unghie difficili: riconoscerle e adattare la costruzione</text><rect x="20" y="60" width="210" height="270" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="125.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">A cucchiaio (coilonichia)</text><path d="M30,200 L150,200 C195,200 195,240 150,250 L30,250 Z" fill="url(#nxSkin)" stroke="#d39c80"/><path d="M80,196 Q130,214 185,190" stroke="#b9496f" stroke-width="5" fill="none"/><path d="M130,192 q5,8 0,12 q-5,-4 0,-12 z" fill="#7fc3e8"/><text x="125.0" y="150.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">test della goccia</text><text x="125.0" y="300.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#3b2a30">livella la conca, poi l'apex</text><rect x="245" y="60" width="210" height="270" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="350.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Ski-jump (punta in su)</text><path d="M255,200 L375,200 C420,200 420,240 375,250 L255,250 Z" fill="url(#nxSkin)" stroke="#d39c80"/><path d="M305,199 L385,199 Q410,196 425,170" stroke="#b9496f" stroke-width="5" fill="none"/><line x1="385" y1="200" x2="440" y2="206" stroke="#2f8a5b" stroke-width="2" stroke-dasharray="5 4"/><text x="350.0" y="300.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#3b2a30">accorcia, cartina inclinata in giù</text><rect x="470" y="60" width="210" height="270" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="575.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">A pinza / a tegola</text><path d="M535,230 C545,150 605,150 615,230" stroke="#c2577a" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="575" cy="215" rx="30" ry="22" fill="#f0a090" opacity=".6"/><text x="575.0" y="150.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">vista dalla punta</text><text x="575.0" y="300.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#3b2a30">curva C moderata, niente pinching</text><rect x="695" y="60" width="210" height="270" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="800.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Piatta e larga</text><path d="M740,220 Q800,205 860,220" stroke="#c2577a" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M745,250 Q800,200 855,250" stroke="#2f8a5b" stroke-width="3" fill="none" stroke-dasharray="6 4"/><text x="800.0" y="150.0" font-size="12" text-anchor="middle" font-weight="400" fill="#7a6369">vista dalla punta</text><text x="800.0" y="300.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#3b2a30">crea la curva C, lati non svasati</text><text x="470.0" y="355.0" font-size="13" text-anchor="middle" font-weight="600" fill="#c0392b">Forma insolita, comparsa da poco o dolorosa? Consiglia il medico (es. la coilonichia è spesso legata a carenza di ferro).</text></svg>
