30">curva C moderata, niente pinching</text><rect x="695" y="60" width="210" height="270" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="800.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Piatta e larga</text><defs><linearGradient id="sv206" gradientUnits="userSpaceOnUse" x1="0.0" y1="204.0" x2="0.0" y2="307.0"><stop offset="0" stop-color="#f8dccb"/><stop offset=".45" stop-color="#f3cdb6"/><stop offset="1" stop-color="#dba98f"/></linearGradient></defs><path d="M724.0,216.0 C714.0,272.0 760.0,304.0 800.0,304.0 C840.0,304.0 886.0,272.0 876.0,216.0 Q800.0,224.0 724.0,216.0 Z" fill="url(#sv206)" stroke="#d39c80" stroke-width="1.5"/><path d="M720.0,212.0 Q800.0,204.0 880.0,212.0 Q883.0,217.0 878.0,220.0 Q800.0,220.0 722.0,220.0 Q717.0,217.0 720.0,212.0 Z" fill="#eaa0b6" stroke="#b9496f" stroke-width="1.4"/><path d="M744.0,211.8 Q800.0,208.0 856.0,211.8" stroke="#fff" stroke-width="2" opacity=".55" fill="none" stroke-linecap="round"/><path d="M724,200 Q800,160 876,200" stroke="#2f8a5b" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/><text x="800.0" y="140.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#7a6369">vista dalla punta</text><text x="800.0" y="312.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#3b2a30">crea la curva C, lati non svasati</text><text x="470.0" y="355.0" font-size="13" text-anchor="middle" font-weight="600" fill="#c0392b">Forma insolita, comparsa da poco o dolorosa? Consiglia il medico (es. la coilonichia è spesso legata a carenza di ferro).</text></svg>
