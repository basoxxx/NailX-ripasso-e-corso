80" stroke-width="1.5" fill="none"/><path d="M320.0,189.0 Q329.0,187.5 339.0,187.5" stroke="#fff" stroke-width="3" opacity=".85" fill="none" stroke-linecap="round"/><path d="M299,190 L385,190 Q411,188 429,160 L434,163 Q415,194 385,195 L299,195 Z" fill="#f6d3dc" stroke="#b9496f" stroke-width="1.6"/><line x1="391" y1="194" x2="445" y2="202" stroke="#2f8a5b" stroke-width="2.5" stroke-dasharray="6 4"/><text x="350.0" y="124.0" font-size="15" text-anchor="middle" font-weight="400" fill="#7a6369">tratteggio =</text><text x="350.0" y="142.8" font-size="15" text-anchor="middle" font-weight="400" fill="#7a6369">nuova direzione</text><text x="350.0" y="316.0" font-size="15" text-anchor="middle" font-weight="700" fill="#3b2a30">accorcia, cartina</text><text x="350.0" y="334.8" font-size="15" text-anchor="middle" font-weight="700" fill="#3b2a30">inclinata in giù</text><rect x="470" y="60" width="210" height="288" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="575.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">A pinza / a tegola</text><defs><linearGradient id="sv199" gradientUnits="userSpaceOnUse" x1="0.0" y1="136.0" x2="0.0" y2="299.0"><stop offset="0" stop-color="#f8dccb"/><stop offset=".45" stop-color="#f3cdb6"/><stop offset="1" stop-color="#dba98f"/></linearGradient></defs><path d="M535.0,208.0 C525.0,264.0 535.0,296.0 575.0,296.0 C615.0,296.0 625.0,264.0 615.0,208.0 Q575.0,156.0 535.0,208.0 Z" fill="url(#sv199)" stroke="#d39c80" stroke-width="1.5"/><path d="M531.0,204.0 Q575.0,136.0 619.0,204.0 Q622.0,209.0 617.0,212.0 Q575.0,152.0 533.0,212.0 Q528.0,209.0 531.0,204.0 Z" fill="#eaa0b6" stroke="#b9496f" stroke-width="1.4"/><path d="M544.2,187.3 Q575.0,140.0 605.8,187.3" stroke="#fff" stroke-width="2" opacity=".55" fill="none" stroke-linecap="round"/><line x1="501.0" y1="208.0" x2="523.0" y2="206.0" stroke="#c0392b" stroke-width="2" marker-end="url(#arw)"/><line x1="649.0" y1="208.0" x2="627.0" y2="206.0" stroke="#c0392b" stroke-width="2" marker-end="url(#arw)"/><text x="575.0" y="124.0" font-size="15" text-anchor="middle" font-weight="400" fill="#7a6369">vista dalla punta:</text><text x="575.0" y="142.8" font-size="15" text-anchor="middle" font-weight="400" fill="#7a6369">stringe i lati</text><text x="575.0" y="316.0" font-size="15" text-anchor="middle" font-weight="700" fill="#3b2a30">curva C moderata,</text><text x="575.0" y="334.8" font-size="15" text-anchor="middle" font-weight="700" fill="#3b2a30">niente pinching</text><rect x="695" y="60" width="210" height="288" rx="16" fill="url(#nxPanel)" stroke="#efdcd6" stroke-width="1" filter="url(#nxSh)"/><text x="800.0" y="90.0" font-size="16" text-anchor="middle" font-weight="700" fill="#3b2a30">Piatta e larga</text><defs><linearGradient id="sv200" gradientUnits="userSpaceOnUse" x1="0.0" y1="196.0" x2="0.0" y2="299.0"><stop offset="0" stop-color="#f8dccb"/><stop offset=".45" stop-color="#f3cdb6"/><stop offset="1" stop-color="#dba98f"/></linearGradient></defs><path d="M724.0,208.0 C714.0,264.0 760.0,296.0 800.0,296.0 C840.0,296.0 886.0,264.0 876.0,208.0 Q800.0,216.0 724.0,208.0 Z" fill="url(#sv200)" stroke="#d39c80" stroke-width="1.5"/><path d="M720.0,204.0 Q800.0,196.0 880.0,204.0 Q883.0,209.0 878.0,212.0 Q800.0,212.0 722.0,212.0 Q717.0,209.0 720.0,204.0 Z" fill="#eaa0b6" stroke="#b9496f" stroke-width="1.4"/><path d="M744.0,203.8 Q800.0,200.0 856.0,203.8" stroke="#fff" stroke-width="2" opacity=".55" fill="none" stroke-linecap="round"/><path d="M724,192 Q800,152 876,192" stroke="#2f8a5b" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/><text x="800.0" y="132.0" font-size="15" text-anchor="middle" font-weight="400" fill="#7a6369">vista dalla punta</text><text x="800.0" y="316.0" font-size="15" text-anchor="middle" font-weight="700" fill="#3b2a30">crea la curva C,</text><text x="800.0" y="334.8" font-size="15" text-anchor="middle" font-weight="700" fill="#3b2a30">lati non svasati</text><text x="470.0" y="372.0" font-size="14.5" text-anchor="middle" font-weight="600" fill="#c0392b">Forma insolita, comparsa da poco o dolorosa? Consiglia il medico (es. la coilonichia è spesso legata a carenza di ferro).</text></svg>
