<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Biglietto post-trattamento: fronte con il prossimo appuntamento, retro con tre consigli</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e3b5a"/></marker><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6369"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="are" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="aro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a5b"/></marker><marker id="arwn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker><marker id="arv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6be0"/></marker></defs><text x="20.0" y="38.0" font-size="20" text-anchor="start" font-weight="800" fill="#8e3b5a">Il biglietto post-trattamento</text><rect x="30" y="62" width="335" height="210" rx="14" fill="#fff" stroke="#d8c8c4" stroke-width="2"/><text x="197.0" y="292.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#7a6369">Fronte</text><rect x="395" y="62" width="335" height="210" rx="14" fill="#fff" stroke="#d8c8c4" stroke-width="2"/><text x="562.0" y="292.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#7a6369">Retro</text><circle cx="90" cy="112" r="28" fill="#e9e4e6"/><text x="90.0" y="117.0" font-size="13" text-anchor="middle" font-weight="700" fill="#7a6369">logo</text><text x="134.0" y="108.0" font-size="17" text-anchor="start" font-weight="800" fill="#8e3b5a">Il tuo prossimo</text><text x="134.0" y="129.0" font-size="17" text-anchor="start" font-weight="800" fill="#8e3b5a">appuntamento</text><text x="60.0" y="190.0" font-size="15" text-anchor="start" font-weight="700" fill="#3b2a30">Data</text><line x1="102" y1="192" x2="210" y2="192" stroke="#7a6369" stroke-width="1.5"/><text x="224.0" y="190.0" font-size="15" text-anchor="start" font-weight="700" fill="#3b2a30">Ora</text><line x1="258" y1="192" x2="335" y2="192" stroke="#7a6369" stroke-width="1.5"/><g transform="translate(320.0,240.0) scale(0.900)"><rect x="-16" y="-14" width="32" height="30" rx="4" fill="#fff" stroke="#8e3b5a" stroke-width="2"/><rect x="-16" y="-14" width="32" height="9" rx="3" fill="#8e3b5a"/><line x1="-9" y1="-18" x2="-9" y2="-10" stroke="#8e3b5a" stroke-width="2.5" stroke-linecap="round"/><line x1="9" y1="-18" x2="9" y2="-10" stroke="#8e3b5a" stroke-width="2.5" stroke-linecap="round"/><g fill="#7a6369"><rect x="-10" y="0" width="5" height="4"/><rect x="-2" y="0" width="5" height="4"/><rect x="6" y="0" width="5" height="4"/><rect x="-10" y="7" width="5" height="4"/><rect x="-2" y="7" width="5" height="4"/></g></g><text x="419.0" y="96.0" font-size="16" text-anchor="start" font-weight="800" fill="#8e3b5a">I miei 3 consigli per te:</text><text x="425.0" y="130.0" font-size="15" text-anchor="start" font-weight="600" fill="#3b2a30">1. Olio ogni giorno</text><text x="425.0" y="158.0" font-size="15" text-anchor="start" font-weight="600" fill="#3b2a30">2. Guanti per le pulizie</text><text x="425.0" y="186.0" font-size="15" text-anchor="start" font-weight="600" fill="#3b2a30">3. Non usarle come attrezzi</text><rect x="415" y="222" width="295" height="32" rx="8" fill="#fff6d6"/><text x="562.0" y="243.0" font-size="14.5" text-anchor="middle" font-weight="800" fill="#7a5a12">Se qualcosa si stacca, chiamami</text></svg>
